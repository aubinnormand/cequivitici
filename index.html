/* ============================================================
   3. Champs de recherche
   ============================================================ */

/* garderTexte : pour la référence, le champ affiche le territoire retenu au lieu d'être
   vidé — le choix n'y devient pas un jeton, c'est le texte lui-même qui porte l'information. */
function autocompletion(idChamp, idListe, chemin, versObjet, onChoix, garderTexte) {
  const champ = $(idChamp), liste = $(idListe);
  let minuteur = null, resultats = [], vise = -1;
  const fermer = () => { liste.classList.remove('on'); vise = -1; };

  champ.addEventListener('input', () => {
    clearTimeout(minuteur);
    const q = champ.value.trim();
    if (q.length < 2) return fermer();
    minuteur = setTimeout(async () => {
      try {
        const d = await appel(chemin, { q, per_page:8, locale:langue });
        resultats = d.results.map(versObjet);
        if (!resultats.length) return fermer();
        liste.innerHTML = resultats.map((r, i) =>
          `<div class="prop" data-i="${i}">${echap(r.nom)}<small>${echap(r.detail)}</small></div>`).join('');
        liste.classList.add('on');
      } catch (e) { fermer(); }
    }, 300);
  });

  champ.addEventListener('keydown', e => {
    const props = [...liste.querySelectorAll('.prop')];
    if (!props.length || !liste.classList.contains('on')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      vise = (vise + (e.key === 'ArrowDown' ? 1 : -1) + props.length) % props.length;
      props.forEach((p, i) => p.classList.toggle('vise', i === vise));
    } else if (e.key === 'Enter' && vise >= 0) { e.preventDefault(); choisir(vise); }
    else if (e.key === 'Escape') fermer();
  });

  liste.addEventListener('click', e => {
    const p = e.target.closest('.prop'); if (p) choisir(+p.dataset.i);
  });
  document.addEventListener('click', e => {
    if (!champ.contains(e.target) && !liste.contains(e.target)) fermer();
  });
  function choisir(i) {
    onChoix(resultats[i]);
    if (!garderTexte) champ.value = '';
    fermer();
  }
}

autocompletion('#q-lieu', '#p-lieu', '/places/autocomplete',
  p => ({ id:p.id, nom:p.display_name, detail:p.place_type_name || 'lieu',
          bbox:p.bounding_box_geojson || null, loc:p.location || null, aire:p.bbox_area || null }),
  p => { if (!etat.lieux.some(x => x.id === p.id)) { etat.lieux.push(p); dessinerJetons(); } });

autocompletion('#q-taxon', '#p-taxon', '/taxa/autocomplete',
  t => ({ id:t.id, nom:t.preferred_common_name || t.name, detail:t.rank + ' · ' + t.name }),
  t => { if (!etat.taxons.some(x => x.id === t.id)) { etat.taxons.push(t); dessinerJetons(); } });

function dessinerJetons() {
  const rendre = (liste, cible, type) => {
    $(cible).innerHTML = liste.map((x, i) =>
      `<span class="jeton">${echap(x.nom)}<button data-type="${type}" data-i="${i}" aria-label="Retirer">×</button></span>`).join('');
  };
  rendre(etat.lieux, '#j-lieu', 'lieu');
  if (etat.zone) {
    $('#j-lieu').insertAdjacentHTML('beforeend',
      `<span class="jeton">${t('zoneTracee')}<button data-type="zone" aria-label="Retirer">×</button></span>`);
  }
  rendre(etat.taxons, '#j-taxon', 'taxon');
  $('#lancer').disabled = !etat.lieux.length && !etat.taxons.length && !etat.zone;
  document.body.classList.toggle('attente', !etat.charge);
  if (!etat.charge) $('#etat').textContent = t((etat.lieux.length || etat.taxons.length || etat.zone) ? 'pret' : 'choisirLieu');
}

document.addEventListener('click', e => {
  const b = e.target.closest('.jeton button'); if (!b) return;
  if (b.dataset.type === 'zone') etat.zone = null;
  else (b.dataset.type === 'lieu' ? etat.lieux : etat.taxons).splice(+b.dataset.i, 1);
  dessinerJetons();
  if (b.dataset.type !== 'taxon') tracerChoix();
});


$('#f-nommage').addEventListener('change', e => {
  vue.nommage = e.target.value;
  majURL();
  if (etat.especes.length) { dessinerListe(); dessinerResponsabilite(); }
  majLegende();          // la légende de la carte porte des noms d'espèces
});

$('#f-qualite').addEventListener('change', e => {
  /* Le niveau fait partie de l'identité de l'inventaire : le changer ne recharge rien, il
     prépare le prochain chargement. Relancer d'office plusieurs minutes de requêtes sur un
     simple changement de menu serait une mauvaise surprise, et le bouton est juste à côté. */
  etat.qualite = e.target.value;
  majURL();
  majCarte();
  if (etat.especes.length) $('#etat').textContent = t('pret');
});


/* ============================================================
   4. Chargement
   ============================================================ */

$('#lancer').addEventListener('click', charger);

/* Efface tout ce qui vient de l'inventaire précédent, y compris les séries temporelles. */
function reinitialiser() {
  etat.especes = []; etat.arbre = null;
  etat.annees = null; etat.mensuel = null; etat.tronque = false;
  etat.seriesCache = { research:{}, toutes:{} };
  etat.moisCache.clear(); moisV2 = null;
  etat.phenologie = null;
  etat.panier = []; cachePhotos.clear();
  etat.refFaite = { toutes:false, research:false };
  indexEspeces = null;
  decouvertes = null;
  disparitions = null;
  bio = null; bioTente = false; carteBio = null; vueBio = null; anneauxLieu = null;
  comm = null; commArbre = null;
  predEspece = null; cartePredOnglet = null;
  etat.phenoCache = { research:null, toutes:null };
  Object.assign(vue, { noeud:null, texte:'', mois:0 });
  vue.deplies.clear();
  seuilMin = 1;
  const attente = `<div class="vide"><strong>${t('chargeCours')}</strong>${t('effacePrec')}</div>`;
  ['#v-liste', '#v-saison', '#v-decouverte', '#v-disparition', '#v-comparaison', '#v-bio', '#r-tableau'].forEach(s => { $(s).innerHTML = attente; });
  $('#r-compte').textContent = '';
  // On revient à la liste : garder sous les yeux un onglet vide n'apprend rien.
  const versListe = document.querySelector('nav.onglets button[data-vue="liste"]');
  if (versListe && !versListe.classList.contains('actif')) versListe.click();
}

function charger() {
  /* On invalide sur-le-champ : la tâche en cours s'arrêtera à sa prochaine vérification,
     sans quoi le nouveau chargement attendrait la fin de l'ancien dans la file des tâches. */
  generation++;
  return enTache(chargerMaintenant);
}

async function chargerMaintenant() {
  const gen = ++generation;          // toute exécution antérieure devient caduque
  $('#lancer').disabled = true;
  etat.charge = true;
  document.body.classList.remove('attente');
  reinitialiser();
  majURL(true);

  try {
    if (await restaurer(gen)) {
      /* Inventaire retrouvé en mémoire. Il peut lui manquer des pièces — effectifs de
         référence, phénologie, statut d'introduction — si la session précédente n'était pas
         allée jusqu'au bout ou si l'enregistrement date d'avant leur ajout. On complète en
         arrière-plan plutôt que de tout redemander. */
      $('#lancer').disabled = false;
      enTache(() => completerManquant(gen));
      return;
    }
    await chargerEspeces();               verifier(gen);
    appliquerQualite();
    construireArbre();          // arbre provisoire : genres seuls, disponibles sans requête
    dessinerListe();            // la liste est utilisable pendant que les rangs se chargent
    dessinerResponsabilite();
    if (carte) { majCarte(); cadrerSurLieux(); }

    // Un échec sur les noms ne doit pas emporter l'inventaire entier.
    try {
      await chargerAncetres();            verifier(gen);
      consoliderGenres();         // écarte les sections prises à tort pour des genres
      construireArbre();          // second passage, cette fois limité aux rangs retenus
    } catch (e) {
      if (e instanceof Annule) throw e;
      progression(t('mTaxoPartielle'), null);
    }
    dessinerListe();
    progression(t('mPret', nb(etat.especes.length)), null);
    $('#lancer').disabled = false;
    enTache(() => completer(gen));   // file d'attente : la suite ne s'intercale pas
  } catch (e) {
    $('#lancer').disabled = false;
    if (e instanceof Annule) return;      // un chargement plus récent a pris la main
    const m = String((e && e.message) || e);
    progression(/Failed to fetch|NetworkError|Load failed/.test(m)
      ? t('mReseau') : t('mEchec', m), null);
  }
}

/* Tout ce dont la liste n'a pas besoin se charge après elle, dans l'ordre des onglets :
   saisonnalité, puis responsabilité, puis statistiques, puis l'autre niveau de validation.
   Chaque étape rafraîchit sa vue au passage, et l'utilisateur explore pendant ce temps. */
/* Un inventaire tiré de la mémoire peut être incomplet : il a pu être enregistré avant que
   la séquence de fond n'ait tout calculé, ou une étape a pu échouer. On reprend donc ce qui
   manque, et seulement cela — le reste s'affiche immédiatement. */
async function completerManquant(gen) {
  const q = etat.qualite;
  let fait = false;
  try {
    if (!etat.annees) {
      await chargerAnnees(); verifier(gen); dessinerListe(); fait = true;
    }
    /* On se fie à un drapeau plutôt qu'aux valeurs : une espèce sans effectif de référence
       garde légitimement la valeur nulle, et la relire comme « jamais demandé » relançait
       tout le chargement à chaque ouverture d'un inventaire en mémoire. */
    if (!etat.refFaite[q]) {
      await chargerEffectifsMondiaux(); verifier(gen);
      dessinerResponsabilite(); if (vue.tri === 'resp') dessinerListe(); fait = true;
    }
    if (!etat.phenologie) {
      await chargerMensuel(); verifier(gen); dessinerSaison(); fait = true;
    }

    if (fait) { progression(t('mComplet'), null); enregistrer(); }
  } catch (e) {
    if (e instanceof Annule) return;
    progression(t('mEchec', String((e && e.message) || e)), null);
  }
}

async function completer(gen) {
  try {
    await chargerAnnees();                verifier(gen);   // une requête : alimente le bandeau
    dessinerListe();
    await chargerEffectifsMondiaux();     verifier(gen);    // peu coûteux, très consulté
    dessinerResponsabilite();
    if (vue.tri === 'resp') dessinerListe();
    await chargerMensuel();               verifier(gen);
    dessinerSaison();
    // Découvertes et disparitions attendent une demande explicite : ensemble elles coûtent
    // une quarantaine de requêtes, souvent pour des onglets qu'on n'ouvrira pas.
    progression(t('mComplet'), null);
    enregistrer();
  } catch (e) {
    if (e instanceof Annule) return;
    const m = String((e && e.message) || e);
    progression(/Failed to fetch|NetworkError|Load failed/.test(m)
      ? t('mReseau') : t('mEchec', m), null);
  }
}

/* Un seul niveau de validation par inventaire. Charger les deux d'un coup rendait la bascule
   instantanée, mais doublait chaque requête pour un niveau qu'on ne consultera peut-être
   jamais. Ce sont deux inventaires distincts, avec leur propre entrée en mémoire. */
function niveaux() { return [etat.qualite]; }

/* Une page de species_counts, allégée si la v2 le permet. Le premier lot sert de contrôle :
   sans nom ni rang ni chaîne d'ancêtres exploitables, on renonce à la v2 pour cette requête. */
async function pageEspeces(f, page) {
  if (especesV2 !== false && await testerV2()) {
    try {
      const d = await appel('/observations/species_counts',
        { ...f, per_page:500, page, fields:CHAMPS_ESPECE }, true);
      const t0 = d.results[0] && d.results[0].taxon;
      if (especesV2 === null) {
        especesV2 = !!(t0 && t0.name && t0.rank && Array.isArray(t0.ancestor_ids));
        console.info(especesV2 ? 'Liste allégée par la v2' : 'Liste : champs incomplets en v2, retour à la v1');
      }
      if (especesV2) return d;
    } catch (e) { especesV2 = false; }
  }
  return appel('/observations/species_counts', { ...f, per_page:500, page });
}

async function chargerEspeces() {
  const gen = generation;
  const parId = new Map();
  etat.tronque = false;

  for (const q of niveaux()) {
    const f = filtres(true, q);
    let page = 1, total = null;
    while (page <= 20) {
      progression(t('mLecture', t(q === 'research' ? 'cValidees' : 'cToutesObs'), page), total ? (parId.size / Math.min(total, 10000)) * 100 : 5);
      const d = await pageEspeces(f, page);
      verifier(gen);
      if (total === null) {
        total = d.total_results;
        if (q === 'toutes') etat.tronque = total > 10000;
      }
      let lus = 0;
      for (const r of d.results) {
        const t = r.taxon, ph = t.default_photo;
        let e = parId.get(t.id);
        if (!e) {
          const cs = t.conservation_status || (t.conservation_statuses || [])[0] || null;
          e = {
            id:t.id, nom:t.name, nomFr:t.preferred_common_name || '', rang:t.rank,
            photo: ph ? (ph.medium_url || String(ph.url || '').replace('/square.', '/medium.')) : null,
            photoPetite: ph ? (ph.square_url || ph.url || ph.medium_url) : null,
            credit: ph ? (ph.attribution || '') : '',
            anc: t.ancestor_ids || [],
            iucn: cs ? (cs.iucn ?? CODE_IUCN[String(cs.status || '').toLowerCase()] ?? null) : null,
            nz:{ toutes:0, research:0 }, nm:{ toutes:0, research:0 },
            nZone:0, nMonde:null,
            etab: etablissement(t)
          };
          parId.set(t.id, e);
        }
        e.nz[q] = r.count;
        lus++;
      }
      if (lus < 500 || page * 500 >= Math.min(total, 10000)) break;
      page++;
    }
  }
  etat.especes = [...parId.values()];
  const rangs = {};
  etat.especes.forEach(e => { rangs[e.rang || '?'] = (rangs[e.rang || '?'] || 0) + 1; });
  console.info('Rangs renvoyés par l\'API :', rangs);
}


/* Bascule d'un niveau à l'autre : simple recopie, aucune requête. */
function appliquerQualite() {
  etat.especes.forEach(e => { e.nZone = e.nz[etat.qualite]; e.nMonde = e.nm[etat.qualite]; });
}

/* Le genre se lit dans le nom binomial : « Quercus robur » appartient à « Quercus ».
   Comme chaque espèce apporte un genre presque toujours unique, les deviner localement
   supprime à lui seul la grande majorité des identifiants à aller chercher. */
function genreLocal(e) {
  if (e.rang !== 'species' || !e.anc.length) return null;
  const dernier = e.anc[e.anc.length - 1];
  const id = dernier === e.id ? e.anc[e.anc.length - 2] : dernier;
  const nom = e.nom.split(' ')[0];
  return id && nom ? { id, nom } : null;
}

/* Le dernier ancêtre d'une espèce n'est pas toujours son genre : chez les plantes c'est
   souvent une section ou un sous-genre, qui porte d'ailleurs le même nom que le genre.
   Ces entrées déduites sont donc marquées provisoires, et cette passe les confronte à la
   chaîne complète : dans une même lignée, seul le plus haut des candidats est le vrai
   genre, les autres sont des sous-rangs et sortent de l'arbre. */
function consoliderGenres() {
  const faux = new Set();
  for (const e of etat.especes) {
    let trouve = false;
    for (const id of chaineBrute(e)) {
      const a = etat.ancetres.get(id);
      if (!a || a.rang !== 'genus') continue;
      if (!trouve) { trouve = true; continue; }
      if (a.provisoire) faux.add(id);
    }
  }
  faux.forEach(id => etat.ancetres.delete(id));
  return faux.size;
}

async function chargerAncetres() {
  const gen = generation;
  for (const e of etat.especes) {
    const g = genreLocal(e);
    if (g && !etat.ancetres.has(g.id))
      etat.ancetres.set(g.id, { nom:g.nom, nomFr:'', rang:'genus', provisoire:true });
  }

  const ids = idsANommer().filter(id => !etat.ancetres.has(id));

  // Le multi-get /taxa/{ids} n'accepte pas plus de 30 identifiants : au-delà il répond 422.
  let i = 0, taille = 30;
  while (i < ids.length) {
    progression(t('mTaxo', Math.round((i / ids.length) * 100)), (i / ids.length) * 100);
    const lot = ids.slice(i, i + taille);
    try {
      const d = await appel('/taxa/' + lot.join(','), { locale:langue });
      verifier(gen);
      d.results.forEach(t => etat.ancetres.set(t.id,
        { nom:t.name, nomFr:t.preferred_common_name || '', rang:t.rank }));
      // Réponse tronquée : on repasse sur le même segment en plus petits lots.
      if (d.results.length < lot.length && taille > 10) { taille = 10; continue; }
    } catch (e) {
      if (taille > 10) { taille = 10; continue; }
      // Ce lot reste sans nom : la branche s'affichera en attente plutôt que de tout interrompre.
    }
    i += lot.length;
  }
}

/* Rangs retenus pour la navigation. Les autres — sous-classe, super-famille, tribu,
   sous-genre… — sont ignorés : ils allongent l'arbre sans aider à s'y repérer. */
/* Papilionoidea, Apoidea, Bombycoidea : la super-famille est le rang usuel de découpage
   chez les papillons et les hyménoptères, elle a sa place dans l'échelle. */
/* Échelle fixe et universelle, sans les rangs facultatifs. Sous-ordres et super-familles
   n'existent que dans certaines lignées : là où ils sont présents ils ajoutent un niveau,
   là où ils manquent le suivant remonte, et l'arbre finit par mêler des ordres et des
   super-familles sur une même rangée. En s'en tenant aux rangs que tout taxon possède, chaque
   niveau de l'arbre désigne le même rang partout. Le détail d'une espèce, lui, les affiche :
   c'est une lecture verticale, où l'homogénéité entre branches n'a pas d'objet. */
const RANGS_ARBRE = new Set(['phylum','class','order','suborder','superfamily',
                             'family','genus','species','subspecies']);

/* Rangs facultatifs : présents chez certains groupes, absents chez d'autres. On les garde,
   mais un niveau ne les affiche que si toutes les branches sœurs en possèdent un — sans quoi
   l'arbre mêlerait des ordres et des super-familles sur une même rangée. */
const RANGS_OPTIONNELS = new Set(['suborder', 'superfamily']);

/* Le détail d'une espèce remonte un cran plus haut que l'arbre de navigation : le règne y a
   sa place, alors qu'il n'y créerait aucune division utile dans l'arbre. */
const RANGS_LIGNAGE = new Set(['kingdom', 'phylum', 'class', 'order', 'suborder',
  'superfamily', 'family', 'genus', 'species', 'subspecies']);


function chaineBrute(e) {
  // La chaîne se termine parfois par l'espèce elle-même : on ne coupe qu'à cet endroit.
  return e.anc[e.anc.length - 1] === e.id ? e.anc.slice(0, -1) : e.anc;
}

/* Le filtre vaut à tout moment, y compris avant le chargement des rangs. Au premier passage
   seuls les genres sont connus — déduits du nom binomial — donc l'arbre provisoire est une
   liste de genres. Il s'étoffe ensuite. Un rang jamais identifié reste écarté plutôt que
   d'apparaître sans qu'on sache ce qu'il est. */
function chaineAncetres(e) {
  return chaineBrute(e).filter(id => {
    const a = etat.ancetres.get(id);
    return a && RANGS_ARBRE.has(a.rang);
  });
}

/* Il faut connaître le rang de TOUS les ancêtres, pas seulement de ceux qu'un arbre
   provisoire aurait affichés : une famille à genre unique y est déjà absorbée, et si son
   rang restait inconnu elle serait écartée au filtrage, laissant son genre remonter à côté
   des familles voisines. En revanche le tronc au-dessus du dernier clade commun ne sert à
   rien, sauf le clade lui-même qui nomme la racine. */
/* Tous les ancêtres, tronc compris. L'arbre de navigation ne montre pas ce tronc — il part du
   dernier clade commun — mais le détail d'une espèce doit remonter jusqu'à l'embranchement.
   Le surcoût est négligeable : le tronc compte une poignée d'identifiants, partagés par
   toutes les espèces, soit une requête de plus. */
function idsANommer() {
  const tous = new Set();
  for (const e of etat.especes) for (const id of chaineBrute(e)) tous.add(id);
  return [...tous];
}

/* La racine descend jusqu'au dernier clade commun à toutes les espèces : Animalia et Insecta
   contiennent exactement le même contenu qu'Odonata, autant partir d'Odonata. Ensuite, tout
   nœud qui n'a qu'un seul descendant absorbe ce descendant en gardant son propre nom, de sorte
   que deux entrées voisines représentent toujours le même niveau de découpage. */
/* Espèces sur lesquelles l'arbre est bâti. Il doit refléter ce que la liste montre : filtrer
   les introduites ou un mois sans que la taxonomie suive laisserait des branches vides et un
   décompte trompeur. Le filtre textuel, lui, reste hors de l'arbre — il sert à chercher dans
   une branche, pas à la redéfinir. */
/* Reconstruit l'arbre et ramène la vue à la racine si la branche sélectionnée a disparu :
   rester sur une famille que le filtre vient d'écarter afficherait une liste vide. */
function reconstruireArbre() {
  construireArbre();
  if (vue.noeud && !noeudExiste(etat.arbre, vue.noeud)) { vue.noeud = null; vue.deplies.clear(); }
}

function noeudExiste(n, id) {
  if (n.id === id) return true;
  for (const c of n.enfants.values()) if (noeudExiste(c, id)) return true;
  return false;
}

/* La recherche porte sur le nom et sur la lignée : taper « Asteraceae » retient toutes les
   espèces du clade. Le même prédicat sert à la grille et à la taxonomie, qui doivent montrer
   le même ensemble — sinon l'arbre annonce des effectifs que la grille ne montre plus. */
function correspondRecherche(e) {
  const q = (vue.texte || '').toLowerCase();
  if (!q) return true;
  if (e.nom.toLowerCase().includes(q) || (e.nomFr || '').toLowerCase().includes(q)) return true;
  return e.anc.some(id => {
    const a = etat.ancetres.get(id);
    return a && ((a.nom || '').toLowerCase().includes(q)
              || (a.nomFr || '').toLowerCase().includes(q));
  });
}

function especesPourArbre() {
  let l = etat.especes.filter(e => e.nZone > 0);
  if (vue.texte) l = l.filter(correspondRecherche);
  if (vue.intro !== 'tout')
    l = l.filter(e => estIntroduite(e.id) === (vue.intro === 'seul'));
  if (vue.mois && etat.phenologie)
    l = l.filter(e => { const m = etat.phenologie.get(e.id); return m && m[vue.mois - 1] > 0; });
  return l;
}

function construireArbre() {
  const trie = { id:null, enfants:new Map(), n:0 };
  // L'arbre est bâti sur les espèces que la liste retient : filtrer l'une sans l'autre
  // laisserait des branches vides et des décomptes faux.
  for (const e of especesPourArbre()) {
    if (!e.nZone) continue;   // absente au niveau de validation courant
    let n = trie; n.n++;
    for (const id of chaineAncetres(e)) {
      if (!n.enfants.has(id)) n.enfants.set(id, { id, enfants:new Map(), n:0 });
      n = n.enfants.get(id); n.n++;
    }
  }

  const compresser = n => {
    let enfants = n.enfants;
    while (enfants.size === 1) enfants = [...enfants.values()][0].enfants;
    const sortie = new Map();
    enfants.forEach(c => { const k = compresser(c); sortie.set(k.id, k); });
    return { id:n.id, n:n.n, enfants:sortie };
  };

  let racine = trie;
  while (racine.enfants.size === 1) racine = [...racine.enfants.values()][0];
  etat.arbre = compresser(racine);
  homogeneiser(etat.arbre);
}

/* Rend chaque niveau homogène en rang. Si les enfants d'un nœud ne partagent pas tous le même
   rang, on remonte ceux dont le rang est facultatif : leurs propres enfants prennent leur
   place. Un sous-ordre subsiste donc chez les insectes, où tous les ordres en ont, et
   s'efface là où il ne concerne qu'une lignée sur trois. L'opération se répète, la promotion
   pouvant faire apparaître un nouveau mélange. */
function homogeneiser(n) {
  const rangDe = id => { const a = etat.ancetres.get(id); return a ? a.rang : ''; };

  for (let tour = 0; tour < 4; tour++) {
    const enfants = [...n.enfants.values()];
    if (enfants.length < 2) break;
    const rangs = new Set(enfants.map(c => rangDe(c.id)));
    if (rangs.size <= 1) break;

    const promus = new Map();
    let change = false;
    for (const c of enfants) {
      if (RANGS_OPTIONNELS.has(rangDe(c.id)) && c.enfants.size) {
        c.enfants.forEach(g => promus.set(g.id, g));
        change = true;
      } else promus.set(c.id, c);
    }
    if (!change) break;
    n.enfants = promus;
  }
  n.enfants.forEach(homogeneiser);
}

/* L'arbre suit le tri choisi pour la liste : en mode alphabétique, les branches se rangent
   par nom, sinon par effectif décroissant. Voir la taxonomie ordonnée autrement que la grille
   qu'elle commande serait déroutant. */
function ordonnerBranches(l) {
  if (vue.tri === 'nom')
    return l.sort((a, b) => infoNoeud(a).nom.localeCompare(infoNoeud(b).nom, langue));
  return l.sort((a, b) => b.n - a.n);
}

/* Identifiants effectivement affichés : ce sont les seuls dont il faut chercher le nom. */
function idsArbre(n, acc = []) {
  if (n.id) acc.push(n.id);
  n.enfants.forEach(c => idsArbre(c, acc));
  return acc;
}

function infoNoeud(n) {
  const a = etat.ancetres.get(n.id);
  return {
    nom: a ? nomCourt(a.nom, a.nomFr) : '…',
    sci: a ? (a.nomFr ? a.nom + ' · ' + a.nomFr : a.nom) : '',
    rang: a ? (NOM_RANG[a.rang] || a.rang || '') : '',
    latin: a ? (vue.nommage === 'sci' || !a.nomFr) : false
  };
}

/* Les résultats reviennent triés par effectif décroissant : si la réponse est tronquée, ce
   sont les espèces les moins observées au monde qui manquent. Deux règles évitent le faux
   chiffre. On pagine jusqu'à ce que tous les taxons demandés soient revenus. Et un taxon
   absent reste inconnu plutôt que de recevoir son effectif local — ce repli fabriquait une
   part de 100 % parfaitement crédible et parfaitement fausse. */
async function chargerEffectifsMondiaux() {
  const gen = generation;
  const paquets = [];
  for (let i = 0; i < etat.especes.length; i += 200) paquets.push(etat.especes.slice(i, i + 200));

  for (const q of niveaux()) {
    const f = filtres(false, q);
    const parId = new Map();
    for (let i = 0; i < paquets.length; i++) {
      progression(t('mEffectifs', t(q === 'research' ? 'cValidees' : 'cToutesObs'), i + 1, paquets.length),
        (i / paquets.length) * 100);
      const ids = paquets[i].map(e => e.id);
      for (let page = 1; page <= 4; page++) {
        const d = await comptages({ ...f, taxon_id: ids.join(','), per_page:500, page });
        verifier(gen);
        d.results.forEach(r => parId.set(r.taxon.id, r.count));
        // Une page incomplète signifie qu'il n'y a rien de plus : les taxons sans observation
        // ne reviennent jamais, attendre qu'ils reviennent coûtait trois requêtes pour rien.
        if (d.results.length < 500 || ids.every(id => parId.has(id))) break;
      }
      const manquants = ids.filter(id => !parId.has(id));
      if (manquants.length) console.warn('Effectifs de référence : ' + manquants.length
        + ' taxons sans réponse, ils resteront sans part.', manquants.slice(0, 5));
    }
    etat.especes.forEach(e => { e.nm[q] = parId.has(e.id) ? parId.get(e.id) : null; });

    /* Un effectif de référence inférieur à l'effectif local est impossible : la zone est
       incluse dans le territoire de comparaison. Quand cela se produit, la valeur groupée
       est fausse — l'API renvoie parfois un comptage tronqué sur certains taxons. On les
       réinterroge un par un, ce qui ne concerne jamais qu'une poignée d'espèces. */
    const suspects = etat.especes.filter(e => e.nm[q] !== null && e.nm[q] < e.nz[q]);
    if (suspects.length) {
      console.warn('Effectifs de référence : ' + suspects.length
        + ' valeurs inférieures à l\'effectif local, réinterrogées individuellement.',
        suspects.map(e => e.nom + ' (id ' + e.id + ', ici ' + e.nz[q]
          + ', référence ' + e.nm[q] + ')'));
    }
    for (const e of suspects.slice(0, 40)) {
      try {
        const d = await comptages({ ...f, taxon_id:e.id, per_page:1 });
        verifier(gen);
        const r = d.results && d.results[0];
        if (r && r.count) e.nm[q] = r.count;
      } catch (err) { if (err instanceof Annule) throw err; }
      /* Si la reprise échoue, la donnée est déclarée douteuse. Plutôt que d'inventer une
         valeur, on la plafonne pour l'affichage et on marque l'espèce, qui sera reléguée en
         fin de tableau au lieu d'en occuper la tête avec un pourcentage absurde. */
      if (e.nm[q] < e.nz[q]) { e.nm[q] = e.nz[q]; e.douteux = true; }
    }
    // Le niveau est traité : les valeurs nulles qu'il laisse sont des absences réelles.
    etat.refFaite[q] = true;
  }
  appliquerQualite();
}

/* Un seul histogramme suffit désormais : il donne le total d'observations et la première
   année documentée. La courbe cumulée exigeait une requête par année ; elle a disparu avec
   le graphique qu'elle alimentait. */
/* Statut d'établissement. iNaturalist le renseigne lieu par lieu, et la recherche accepte
   un filtre : une requête paginée donne toutes les espèces considérées comme introduites
   dans la zone d'étude. Sans lieu sélectionné, la notion n'a pas de sens et on s'abstient. */
async function chargerAnnees(q = etat.qualite) {
  const gen = generation;
  const memo = etat.seriesCache[q];
  if (memo && memo.annees) { if (q === etat.qualite) etat.annees = memo.annees; return; }
  const f = filtres(true, q);
  const h = await appel('/observations/histogram', { ...f, date_field:'observed', interval:'year' });
  verifier(gen);
  const parAn = (h.results && h.results.year) || {};
  const lignes = Object.keys(parAn)
    .map(k => ({ annee:+k.slice(0, 4), obs:parAn[k] }))
    .filter(l => l.obs > 0)
    .sort((a, b) => a.annee - b.annee);
  /* Le nombre d'observateurs distincts tient dans le total_results de cet endpoint :
     une requête d'un seul résultat suffit, on ne lit que le compteur. */
  try {
    const o = await appel('/observations/observers', { ...f, per_page:1 });
    verifier(gen);
    etat.seriesCache[q].observateurs = o.total_results || 0;
  } catch (e) {
    if (e instanceof Annule) throw e;
  }

  etat.seriesCache[q].annees = lignes;
  if (q === etat.qualite) etat.annees = lignes;
}

/* Saisonnalité : un histogramme pour les observations, une requête par mois pour les espèces. */
/* En mode complet, on charge les listes mensuelles entières : elles alimentent la courbe
   de saisonnalité ET le panneau « à chercher », qui n'ont plus besoin de deux passages.
   Pour le niveau de validation qu'on ne regarde pas, la version légère suffit. */
async function chargerMensuel(q = etat.qualite, complet = (q === etat.qualite)) {
  const gen = generation;
  const memo = etat.seriesCache[q];
  const dejaFait = memo && memo.mensuel && (!complet || etat.phenoCache[q]);
  if (dejaFait) {
    if (q === etat.qualite) { etat.mensuel = memo.mensuel; etat.phenologie = etat.phenoCache[q]; }
    return;
  }

  const f = filtres(true, q);
  const h = await appel('/observations/histogram',
    { ...f, date_field:'observed', interval:'month_of_year' });
  const parMois = (h.results && h.results.month_of_year) || {};
  const lignes = [];
  const pheno = complet ? new Map() : null;

  for (let m = 1; m <= 12; m++) {
    progression(t('mSaison', MOIS[m - 1]), (m / 12) * 100);
    let especes = null;
    try {
      if (complet) {
        const r = await chargerMois(m, q);
        especes = r.total;
        if (!etat.moisTronque) etat.moisTronque = new Array(12).fill(false);
        etat.moisTronque[m - 1] = !!r.tronque;
        r.parId.forEach((n, id) => {
          if (!pheno.has(id)) pheno.set(id, new Array(12).fill(0));
          pheno.get(id)[m - 1] = n;
        });
      } else {
        const esp = await appel('/observations/species_counts', { ...f, month:m, per_page:1 });
        especes = esp.total_results;
      }
    } catch (e) {
      // Sur les grands territoires, un mois peut expirer côté serveur. On note le trou
      // et on poursuit : onze mois valides valent mieux qu'une série entièrement perdue.
      if (e instanceof Annule) throw e;
      console.warn('Saisonnalité : ' + MOIS[m - 1] + ' indisponible', e);
    }
    verifier(gen);
    lignes.push({ mois:m, obs: parMois[m] || parMois[String(m)] || 0, especes });
  }

  console.info('Saisonnalité (' + q + ') :',
    lignes.map(l => MOIS[l.mois - 1].slice(0, 3) + '=' + (l.especes === null ? '?' : l.especes)).join(' '));

  // Douze mois strictement identiques trahiraient un filtre inopérant.
  if (new Set(lignes.map(l => l.especes)).size === 1 && lignes[0].especes > 0) {
    console.warn('Saisonnalité : les douze mois sont identiques, le filtre mensuel semble inopérant.');
  }
  etat.seriesCache[q].mensuel = lignes;
  if (complet) etat.phenoCache[q] = pheno;
  if (q === etat.qualite) {
    etat.mensuel = lignes;
    if (complet) etat.phenologie = pheno;
  }
}

/* La liste d'un mois donne à la fois le détail par espèce et, dans total_results,
   le nombre exact d'espèces de ce mois. Les deux usages partagent donc une seule requête. */
async function chargerMois(m, q = etat.qualite, profond = false) {
  const cle = q + ':' + m + (profond ? ':p' : '');
  if (etat.moisCache.has(cle)) return etat.moisCache.get(cle);
  const f = filtres(true, q);
  const parId = new Map();
  let total = 0;
  /* Deux pages suffisent aux pics mensuels. La complétude, elle, exige la liste entière :
     les résultats arrivent par abondance décroissante, si bien qu'une troncature emporte
     exactement les espèces vues une ou deux fois, celles sur lesquelles Chao1 et ACE
     reposent. On ne descend donc à huit pages que sur demande, et seulement là où les deux
     premières n'ont pas suffi — sur une flore modeste, la complétude est gratuite. */
  const v1 = !(await testerMoisV2(f));
  const pages = profond ? 8 : 2;
  let tronque = false;
  for (let page = 1; page <= pages; page++) {
    const d = await comptages({ ...f, month:m, per_page:500, page }, v1);
    total = d.total_results;
    d.results.forEach(r => parId.set(r.taxon.id, r.count));
    if (d.results.length < 500 || parId.size >= total) break;
    if (page === pages) tronque = true;
  }
  const res = { parId, total, tronque };
  etat.moisCache.set(cle, res);
  return res;
}

/* ============================================================
   5. Onglet Liste
   ============================================================ */

/* L'arbre garde une seule branche ouverte : vue.deplies contient exactement le chemin
   de la racine au nœud courant. Ouvrir ailleurs referme donc tout le reste. */
function cheminNoeud(id) {
  const rec = (n, acc) => {
    if (n.id === id) return acc;
    for (const c of n.enfants.values()) {
      const r = rec(c, [...acc, c.id]);
      if (r) return r;
    }
    return null;
  };
  return (etat.arbre && rec(etat.arbre, [])) || [];
}

function especesVisibles() {
  let liste = etat.especes.filter(e => e.nZone > 0);
  if (vue.noeud) liste = liste.filter(e => e.anc.includes(vue.noeud));
  if (vue.mois) {
    const m = (etat.moisCache.get(etat.qualite + ':' + vue.mois) || {}).parId;
    if (m) liste = liste.filter(e => m.has(e.id)).map(e => ({ ...e, nAffiche:m.get(e.id) }));
  }
  if (vue.intro !== 'tout') {
    liste = liste.filter(e => estIntroduite(e.id) === (vue.intro === 'seul'));
  }
  if (vue.texte) liste = liste.filter(correspondRecherche);
  if (vue.tri === 'nom') return [...liste].sort((a, b) => a.nom.localeCompare(b.nom, langue));
  if (vue.tri === 'resp') {
    // Les espèces sous le seuil d'effectif passent en fin de liste plutôt que d'en sortir.
    const p = e => (e.nMonde >= Math.max(seuilMin, 1)) ? e.nZone / e.nMonde : -1;
    return [...liste].sort((a, b) => p(b) - p(a));
  }
  return [...liste].sort((a, b) => (b.nAffiche ?? b.nZone) - (a.nAffiche ?? a.nZone));
}

function brancheHTML(n, profondeur) {
  const enfants = ordonnerBranches([...n.enfants.values()]);
  const ouvert = vue.deplies.has(n.id);
  const info = infoNoeud(n);
  return `
    <div class="n-noeud">
      <div class="n-ligne${vue.noeud === n.id ? ' sel' : ''}">
        <button class="n-plier${enfants.length ? '' : ' creux'}" data-plier="${n.id}"
          aria-expanded="${ouvert}" aria-label="Déplier ou replier">${ouvert ? '▾' : '▸'}</button>
        <button class="n-nom${info.latin ? ' lat' : ''}" data-noeud="${n.id}"
          title="${echap(info.sci)}">${echap(info.nom)}<span
          class="n-rang">${echap(info.rang)}</span></button>
        <span class="n-nb">${nb(n.n)}</span>
      </div>
      ${enfants.length && ouvert ? `<div class="n-enfants">${
        enfants.map(c => brancheHTML(c, profondeur + 1)).join('')}</div>` : ''}
    </div>`;
}

function dessinerListe() {
  const v = $('#v-liste');
  const defil = v.querySelector('.arbre') ? v.querySelector('.arbre').scrollTop : 0;
  if (!etat.especes.length) {
    v.innerHTML = `<div class="vide"><strong>${t('aucuneEsp')}</strong>${t('essaieAutre')}</div>`;
    return;
  }
  const liste = especesVisibles();
  const racines = ordonnerBranches([...etat.arbre.enfants.values()]);

  const avert = etat.tronque
    ? `<div class="alerte">${t('tronque', nb(etat.especes.length))}</div>` : '';

  v.innerHTML = avert + bandeauChiffres() + `
    <div class="outils">
      <input type="text" id="f-texte" placeholder="${echap(t('phRech'))}" value="${echap(vue.texte)}">
      <select id="f-tri">
        <option value="obs"${vue.tri==='obs'?' selected':''}>${t('triObs')}</option>
        <option value="resp"${vue.tri==='resp'?' selected':''}>${t('triResp')}</option>
        <option value="nom"${vue.tri==='nom'?' selected':''}>${t('triNom')}</option>
      </select>
      <select id="f-intro">
        <option value="tout"${vue.intro==='tout'?' selected':''}>${t('filtreIntroTout')}</option>
        <option value="sans"${vue.intro==='sans'?' selected':''}>${t('filtreIntroSans')}</option>
        <option value="seul"${vue.intro==='seul'?' selected':''}>${t('filtreIntroSeul')}</option>
      </select>
      <select id="f-mois"${etat.phenologie ? '' : ' disabled'}
        title="Filtre l'affichage seulement, pas les autres onglets">
        <option value="0">${t('touteAnnee')}</option>
        ${MOIS.map((m, i) => `<option value="${i+1}"${vue.mois === i+1 ? ' selected':''}>${m}</option>`).join('')}
      </select>
      <span class="compte">${nb(liste.length)} ${t('especes')}${vue.mois ? ' · ' + t('enMois', MOIS[vue.mois-1]) : ''}</span>
    </div>
    <div class="expl">
      <aside class="arbre">
        <div class="entete">${t('taxonomie')}</div>
        <div class="n-ligne${vue.noeud === null ? ' sel' : ''}">
          <button class="n-plier creux"></button>
          <button class="n-nom${infoNoeud(etat.arbre).latin ? ' lat' : ''}" data-noeud="">${etat.arbre.id
            ? echap(infoNoeud(etat.arbre).nom) + '<span class="n-rang">' + t('tout') + '</span>'
            : t('toutesEsp')}</button>
          <span class="n-nb">${nb(etat.arbre.n)}</span>
        </div>
        ${racines.map(r => brancheHTML(r, 0)).join('')}
      </aside>
      <div>
        ${liste.length ? `<div class="planche">${liste.slice(0, 400).map((e, i) => ficheHTML(e, i)).join('')}</div>`
          : `<div class="vide"><strong>${t('rienIci')}</strong>${t('changeBranche')}</div>`}
        ${liste.length > 400 ? `<p class="note">${t('limiteFiches', nb(liste.length))}</p>` : ''}
      </div>
    </div>`;

  brancherListe();
  const panneau = v.querySelector('.arbre');
  if (panneau) panneau.scrollTop = defil;
}

/* Sur petit écran, la vignette carrée d'iNaturalist suffit largement : environ dix fois
   moins d'octets que la version moyenne, pour une case de cent pixels de côté. */
const petitEcran = window.matchMedia('(max-width:640px)').matches;

/* Sur téléphone la grille fait trois colonnes, soit des vignettes d'environ 120 pixels — mais
   deux à trois fois plus en pixels réels sur un écran dense. La miniature carrée d'iNaturalist,
   qui en fait 75, y paraît floue : on demande la variante « small », quatre fois plus définie
   et toujours bien plus légère que la moyenne. */
function vignette(e) {
  if (!petitEcran) return e.photo;
  const p = String(e.photoPetite || '');
  return p.replace('/square.', '/small.') || e.photo;
}

/* Le sélecteur de comparaison, identique partout : la liste, la saisonnalité, les découvertes
   et les disparitions donnent tous accès au même panier. */
/* Une espèce n'est tenue pour introduite que si la fiche vient d'un territoire identifié.
   Le repli sur l'ancienne liste ne joue que si aucun statut n'a été transmis avec l'espèce. */
let indexEspeces = null;      // reconstruit à chaque inventaire, pour un accès direct par id

function especeParId(id) {
  if (!indexEspeces || indexEspeces.taille !== etat.especes.length) {
    indexEspeces = new Map(etat.especes.map(e => [e.id, e]));
    indexEspeces.taille = etat.especes.length;
  }
  return indexEspeces.get(id) || null;
}

/* Statut lu sur la fiche d'établissement renvoyée avec l'espèce, et non sur le filtre
   « introduced » de la recherche d'observations. Ce filtre ne se rapporte pas au lieu
   interrogé : il retient tout taxon introduit où que ce soit dans le monde. Le chêne kermès
   en fait la démonstration — indigène en Europe, en Grèce, au Portugal et en Afrique du Nord,
   introduit dans les seules Abruzzes, il ressortait comme introduit en Provence.

   La fiche, elle, est celle du lieu interrogé ou de son ancêtre le plus proche, ce qui est
   exactement ce qu'on veut. Son absence signifie qu'aucun statut n'a été saisi : on ne conclut
   alors rien, plutôt que de présumer une introduction. */
function estIntroduite(id) {
  const e = especeParId(id);
  return !!(e && e.etab && e.etab.statut === 'introduced');
}

function origineDe(id) {
  const e = especeParId(id);
  return e && e.etab && e.etab.lieu ? e.etab.lieu : '';
}

function boutonPanier(id) {
  return `<button class="choisir${etat.panier.includes(id) ? ' pris' : ''}"
    data-panier="${id}" aria-label="${echap(t('cpAjouter'))}"
    >${etat.panier.includes(id) ? '✓' : '□'}</button>`;
}

function brancherPanier(racine, redessiner) {
  racine.querySelectorAll('[data-panier]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.preventDefault();
      const id = +b.dataset.panier;
      const i = etat.panier.indexOf(id);
      if (i < 0) etat.panier.push(id); else etat.panier.splice(i, 1);
      b.classList.toggle('pris', i < 0);
      b.textContent = i < 0 ? '✓' : '□';
      dessinerComparaison();
      if (redessiner) redessiner();
    });
  });
}

function ficheHTML(e, i) {
  const n = e.nAffiche ?? e.nZone;
  const img = vignette(e);
  const credit = e.credit;
  /* Trois destinations distinctes : la photo mène à la fiche du taxon, l'effectif aux
     observations locales sur la carte d'iNaturalist, et le bouton déplie la lignée sans
     quitter le site. La fiche n'est donc plus un lien unique mais un conteneur. */
  return `
    <div class="fiche">
      <a class="img" href="https://www.inaturalist.org/taxa/${e.id}" target="_blank" rel="noopener">
        ${img ? `<img src="${img}" loading="lazy" decoding="async" alt="">` : ''}
        <span class="num">${String(i + 1).padStart(3, '0')}</span>
      </a>
      ${boutonPanier(e.id)}
      ${estIntroduite(e.id) ? `<span class="intro" title="${
        echap(t('introTitre') + (origineDe(e.id) ? ' — ' + origineDe(e.id) : ''))}">!</span>` : ''}
      <div class="corps">
        ${blocNoms(e.nom, e.nomFr)}
        <div class="bas">
          <a class="n" href="${lienINat(e.id, vue.mois, 'map')}" target="_blank" rel="noopener"
            >${vue.tri === 'resp' && e.nMonde >= Math.max(seuilMin, 1)
            ? pourcent((e.nZone / e.nMonde) * 100)
            : nb(n) + ' ' + t('obs') + (e.nAffiche !== undefined ? ' · ' + t('ceMois') : '')}</a>
          <button class="plus" data-lignage="${e.id}" aria-label="${echap(t('taxonomie'))}">☰</button>
        </div>
      </div>
      <div class="credit">${echap(credit)}</div>
      <div class="taxo">${lignageHTML(e)}</div>
    </div>`;
}

/* Lignée du taxon, telle qu'elle est déjà connue : aucune requête supplémentaire. */
function lignageHTML(e) {
  const chaine = e.anc
    .map(id => ({ id, ...(etat.ancetres.get(id) || {}) }))
    .filter(a => a.nom && RANGS_LIGNAGE.has(a.rang));
  /* Chaque niveau reçoit un retrait et une teinte de plus en plus soutenue : la profondeur
     se lit alors d'un coup d'œil, sans avoir à déchiffrer les noms de rangs. */
  const total = chaine.length + 1;
  const ligne = (rang, nom, i, actif) => {
    const part = total > 1 ? i / (total - 1) : 1;
    const teinte = `hsl(${152 - part * 14}, ${18 + part * 30}%, ${72 - part * 32}%)`;
    return `<div class="lig${actif ? ' actif' : ''}"
      style="padding-left:${6 + i * 7}px; border-left-color:${teinte}">
      <span class="rg">${echap(NOM_RANG[rang] || rang || '')}</span>${echap(nom)}</div>`;
  };
  return chaine.map((a, i) => ligne(a.rang, nomCourt(a.nom, a.nomFr), i, false)).join('')
    + ligne(e.rang, nomCourt(e.nom, e.nomFr), total - 1, true);
}

function brancherListe() {
  $('#f-texte').addEventListener('input', e => {
    const pos = e.target.selectionStart;
    vue.texte = e.target.value;
    reconstruireArbre();      // la taxonomie suit la recherche
    dessinerListe();

}



/* ============================================================
   6. Onglet Carte — tuiles de densité servies par iNaturalist
   ============================================================ */

let carte = null, coucheLimite = null;
const optCarte = { effort:false, panier:false, fond:'plan', precis:false };


function paramsCarte({ avecFocus = true } = {}) {
  const p = new URLSearchParams();
  if (etat.lieux.length) p.set('place_id', etat.lieux.map(l => l.id).join(','));
  if (etat.zone) for (const [k, v] of Object.entries(etat.zone)) p.set(k, v);
  if (etat.qualite === 'research') p.set('quality_grade', 'research');
  p.set('captive', 'false');
  /* Les coordonnées des espèces sensibles sont déplacées d'une trentaine de kilomètres :
     les écarter donne une carte moins fournie mais géographiquement honnête. */
  if (optCarte.precis) { p.set('geoprivacy', 'open'); p.set('taxon_geoprivacy', 'open'); }
  /* La liste de comparaison sert aussi de filtre cartographique : l'API accepte plusieurs
     identifiants de taxons, donc les espèces retenues s'affichent ensemble. */
  const tx = avecFocus && optCarte.panier && etat.panier.length
    ? etat.panier.join(',')
    : (etat.taxons.length ? etat.taxons.map(t => t.id).join(',') : '');
  if (tx) p.set('taxon_id', tx);
  return p;
}

function initCarte() {
  if (!etat.lieux.length && !etat.zone) return;
  if (!carte) {
    carte = L.map('carte', { scrollWheelZoom:true });
    const b = bornesLocales();
    // On cadre avant même d'ajouter les tuiles : pas de passage par une vue France.
    if (b) carte.fitBounds(b, { padding:[24, 24], maxZoom:14 });
    else carte.setView([46.6, 2.5], 5);
    majFond();
    carte.on('click', interrogerPoint);
    surveillerZoom();
    majCarte();
  }
  carte.invalidateSize();       // le conteneur vient seulement d'être affiché
  // La sélection d'espèces a pu changer dans un autre onglet : on redessine à chaque venue.
  majDensite();
  cadrerSurLieux();
}

/* Plus de tuiles de densité : elles étaient calculées à la volée par iNaturalist et pouvaient
   demander plusieurs secondes par image. On récupère désormais les coordonnées seules — la v2
   permet de ne demander que le champ location, soit une quarantaine d'octets par observation —
   et on agrège en carreaux dans le navigateur. Le premier chargement dure quelques secondes,
   après quoi déplacement et zoom sont instantanés et ne coûtent plus rien au serveur. */
let cercleClic = null;



/* La densité vient des tuiles d'iNaturalist : exhaustives, continues au zoom, et rien à
   calculer côté navigateur. Elles sont générées à la volée par le serveur, ce qui les rend
   parfois lentes sur les grandes emprises — c'est le prix de la simplicité. */
let coucheTuiles = null;

/* Trois rendus au choix, tous servis par iNaturalist et donc gratuits pour notre file de
   requêtes : la densité lissée, les points individuels — plus parlants à grande échelle — et
   la grille agrégée. S'y ajoute un fond gris facultatif montrant l'effort d'observation toutes
   espèces confondues : c'est l'écart entre les deux couches qui distingue un signal biologique
   d'une simple concentration d'observateurs. */
let coucheEffort = null, coucheFond = null;
let couchesEsp = [];

/* Deux fonds sans clé d'accès : le plan d'OpenStreetMap, éclairci par un filtre pour laisser
   ressortir les observations, et l'imagerie satellite d'Esri, qu'on laisse telle quelle —
   la désaturer effacerait justement ce qu'on vient y chercher, la structure du paysage. */
/* Trois fonds et un calque de repères. Le relief éclaire beaucoup les cartes de biorégions,
   où les limites suivent souvent les vallées ; le calque de noms se superpose au satellite,
   qui n'en porte aucun. */
const FONDS = {
  plan: { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution:'© OpenStreetMap', classe:'fond-clair' },
  relief: { url:'https://tile.opentopomap.org/{z}/{x}/{y}.png',
            attribution:'© OpenTopoMap, © OpenStreetMap', classe:'', maxZoom:17 },
  satellite: { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
               attribution:'Imagerie © Esri', classe:'' }
};

/* Calque de repères, posé sur le satellite qui ne porte aucun nom : villes, voirie et
   limites administratives, en surimpression légère. */
const ORDRE_FONDS = ['plan', 'relief', 'satellite'];

const REPERES = { url:'https://stamen-tiles.a.ssl.fastly.net/toner-labels/{z}/{x}/{y}.png',
                  attribution:'© Stamen, © OpenStreetMap', maxZoom:18 };

let reperesCarte = null;

function majFond() {
  if (!carte) return;
  if (coucheFond) { carte.removeLayer(coucheFond); coucheFond = null; }
  if (reperesCarte) { carte.removeLayer(reperesCarte); reperesCarte = null; }
  const f = FONDS[optCarte.fond] || FONDS.plan;
  coucheFond = L.tileLayer(f.url, { attribution:f.attribution, maxZoom:f.maxZoom || 19,
    className:f.classe });
  coucheFond.addTo(carte);
  coucheFond.bringToBack();
  if (optCarte.fond === 'satellite') {
    reperesCarte = L.tileLayer(REPERES.url,
      { attribution:REPERES.attribution, maxZoom:REPERES.maxZoom, opacity:0.9 });
    reperesCarte.addTo(carte);
  }
}

/* Huit teintes distinguables, y compris pour la plupart des daltonismes. Au-delà de huit
   espèces la lecture devient illisible : on retombe alors sur une couche unique. */
const PALETTE_ESP = ['#D81E05', '#2F6B4F', '#3A63B8', '#C97E2B',
                     '#7B3B52', '#38A0A8', '#8CC63F', '#A87C14'];
const MAX_COULEURS = 8;

/* Les tuiles acceptent une couleur : une couche par espèce permet de les distinguer d'un
   coup d'œil. Le mode s'active dès que la carte affiche peu d'espèces, quelle qu'en soit la
   raison — une sélection de comparaison, un groupe taxonomique étroit, ou simplement un
   inventaire modeste. */
function especesAffichees() {
  if (optCarte.panier && etat.panier.length) return etat.panier;
  return etat.especes.filter(e => e.nZone > 0).map(e => e.id);
}

function especesColorees() {
  const ids = especesAffichees();
  if (!ids.length || ids.length > MAX_COULEURS) return null;
  const parId = new Map(etat.especes.map(e => [e.id, e]));
  return ids.map((id, i) => ({
    id, couleur: PALETTE_ESP[i % PALETTE_ESP.length],
    nom: (e => e ? nomCourt(e.nom, e.nomFr) : '#' + id)(parId.get(id))
  }));
}

/* Rendu déduit du zoom, sans réglage. En dessous du zoom 13, une tuile de grille agrège
   plusieurs observations et montre où l'on en trouve ; au-delà, chaque carreau n'en contient
   plus qu'une et donne à un point isolé la surface d'une maille, ce qui suggère une
   occupation qui n'existe pas. Les points, eux, disent exactement ce qui a été observé. */
function rendreCarte() {
  return (carte && carte.getZoom() >= 13) ? 'points' : 'grid';
}

/* Le basculement doit se produire au franchissement du seuil, et seulement là : refaire les
   couches à chaque cran de zoom rechargerait des tuiles pour rien. */
let dernierRendu = null;

function surveillerZoom() {
  if (!carte) return;
  carte.on('zoomend', () => {
    const r = rendreCarte();
    if (r !== dernierRendu) { dernierRendu = r; majDensite(); }
  });
}

function majDensite() {
  if (!carte) return;
  if (optCarte.panier && !etat.panier.length) {
    optCarte.panier = false;
    const c = $('#c-panier'); if (c) c.checked = false;
  }
  if (coucheTuiles) { carte.removeLayer(coucheTuiles); coucheTuiles = null; }
  if (coucheEffort) { carte.removeLayer(coucheEffort); coucheEffort = null; }
  couchesEsp.forEach(c => carte.removeLayer(c.couche));
  couchesEsp = [];

  if (optCarte.effort) {
    const brut = new URLSearchParams();
    if (etat.lieux.length) brut.set('place_id', etat.lieux.map(l => l.id).join(','));
    if (etat.zone) for (const [k, v] of Object.entries(etat.zone)) brut.set(k, v);
    brut.set('captive', 'false'); brut.set('verifiable', 'true');
    // Toujours en densité lissée : le fond doit rester une nappe continue sous la couche
    // principale, quel que soit le rendu choisi pour celle-ci.
    coucheEffort = L.tileLayer(API + '/heatmap/{z}/{x}/{y}.png?' + brut.toString(),
      { maxZoom:19, pane:'tilePane', className:'fond-effort',
        keepBuffer:1, updateWhenIdle:true, updateWhenZooming:false }).addTo(carte);
  }

  const colorees = especesColorees();
  const opts = { maxZoom:19, opacity:0.9, keepBuffer:1, updateWhenIdle:true, updateWhenZooming:false };

  if (colorees) {
    /* Couches semi-transparentes : là où deux espèces se recouvrent, les teintes se mêlent
       au lieu que la dernière dessinée masque les autres. L'opacité baisse avec le nombre
       d'espèces, sans quoi cinq couches empilées redeviendraient opaques. */
    // Les points sont petits et se juxtaposent : les rendre translucides les efface.
    const opacite = rendreCarte() === 'points'
      ? 1 : Math.min(1, Math.max(0.42, 0.9 - (colorees.length - 1) * 0.09) * 1.15);
    for (const e of colorees) {
      const p = paramsCarte({ avecFocus:false });
      p.set('taxon_id', e.id);
      p.set('color', e.couleur);
      couchesEsp.push({ ...e,
        couche: L.tileLayer(API + '/' + rendreCarte() + '/{z}/{x}/{y}.png?' + p,
          { ...opts, opacity:opacite }).addTo(carte) });
    }
  } else {
    /* Les tuiles de points prennent une couleur unie : sans consigne, iNaturalist en choisit
       une par défaut, d'où le vert vif qui tranchait avec le reste. On impose celle du site. */
    const p = paramsCarte();
    if (rendreCarte() === 'points') p.set('color', '#2F6B4F');
    coucheTuiles = L.tileLayer(
      API + '/' + rendreCarte() + '/{z}/{x}/{y}.png?' + p.toString(), opts).addTo(carte);
  }
  dernierRendu = rendreCarte();
  majLegende();
}

function majLegende() {
  /* Deux légendes complémentaires : les espèces sur la carte, l'échelle de densité dessous.
     L'une remplace l'autre selon le mode, jamais les deux ensemble. */
  const sur = $('#c-legende-carte');
  if (sur) {
    sur.hidden = !couchesEsp.length;
    sur.innerHTML = couchesEsp.map(e =>
      `<div><span style="display:inline-block; width:12px; height:12px; border-radius:50%;
        flex:none; background:${e.couleur}"></span>${echap(e.nom)}</div>`).join('');
  }
}





/* Taille de carreau choisie pour occuper une trentaine de pixels quel que soit le zoom. */




function majCarte() { majDensite(); }

/* Le rayon suit l'étendue réellement visible plutôt que des paliers de zoom : il vaut
   toujours environ un quinzième de la largeur de la carte, du continent à la rue. */
function rayonKm() {
  const b = carte.getBounds();
  const largeur = b.getNorthWest().distanceTo(b.getNorthEast()) / 1000;
  return Math.max(0.05, Math.min(30, largeur / 15));
}

function formatDistance(km) {
  return km >= 1 ? km.toLocaleString(langue, { maximumFractionDigits:1 }) + ' km'
                 : Math.round(km * 1000) + ' m';
}

async function interrogerPoint(ev) {
  const r = rayonKm();
  const dist = formatDistance(r);
  // Matérialiser le disque interrogé : sans lui, le rayon reste une abstraction.
  if (cercleClic) carte.removeLayer(cercleClic);
  cercleClic = L.circle(ev.latlng, { radius:r * 1000, color:'#2F6B4F', weight:1.5,
    dashArray:'5 4', fillColor:'#2F6B4F', fillOpacity:0.06 }).addTo(carte);
  const bulle = L.popup({ maxWidth:290 }).setLatLng(ev.latlng)
    .setContent(`<div class="pop-tit">${t('cAutour')}</div>
      <div class="pop-sous">${t('cRecherche', dist)}</div>`).openOn(carte);
  // Le cercle n'a de sens qu'avec la bulle qu'il accompagne : il s'efface avec elle.
  bulle.on('remove', () => {
    if (cercleClic) { carte.removeLayer(cercleClic); cercleClic = null; }
  });

  const p = Object.fromEntries(paramsCarte());
  // On interroge un disque autour du clic : ni le lieu ni la zone ne doivent s'y superposer.
  delete p.place_id;
  for (const k of ['swlat', 'swlng', 'nelat', 'nelng']) delete p[k];
  p.lat = ev.latlng.lat.toFixed(5);
  p.lng = ev.latlng.lng.toFixed(5);
  p.radius = r.toFixed(3);
  p.per_page = 8;
  p.locale = 'fr';

  try {
    const d = await appel('/observations/species_counts', p, false, true);
    if (!d.results.length) {
      bulle.setContent(`<div class="pop-tit">${t('cAutour')}</div>
        <div class="pop-sous">${t('cAucune', dist)}</div>`);
      return;
    }
    bulle.setContent(`
      <div class="pop-tit">${t('cEspecesDans', nb(d.total_results), dist)}</div>
      <div class="pop-sous">${t('cPlusObs')} · ${t('cRayon', dist)}</div>
      <ul class="pop-liste">${d.results.map(x => {
        const t = x.taxon;
        return `<li><a href="${lienDisque(t.id, ev.latlng.lat, ev.latlng.lng, r)}"
          target="_blank" rel="noopener"
          style="text-decoration:none"><span>${echap(nomCourt(t.name, t.preferred_common_name))}
          </span></a><b>${nb(x.count)}</b></li>`;
      }).join('')}</ul>`);
  } catch (e) {
    bulle.setContent(`<div class="pop-tit">${t('cAutour')}</div>
      <div class="pop-sous">${t('cEchec')}</div>`);
  }
}

/* Emprise calculée sans aucune requête : l'autocomplétion nous a déjà donné
   la boîte englobante et le point central de chaque lieu. */
function bornesLocales() {
  let b = etat.zone
    ? L.latLngBounds([etat.zone.swlat, etat.zone.swlng], [etat.zone.nelat, etat.zone.nelng])
    : null;
  for (const l of etat.lieux) {
    let x = null;
    if (l.bbox) { const g = L.geoJSON(l.bbox).getBounds(); if (g.isValid()) x = g; }
    if (!x && l.loc) {
      const [la, ln] = String(l.loc).split(',').map(Number);
      if (isFinite(la) && isFinite(ln)) {
        const c = Math.sqrt(l.aire || 0.04) / 2 || 0.1;
        x = L.latLngBounds([la - c, ln - c], [la + c, ln + c]);
      }
    }
    if (x) b = b ? b.extend(x) : x;
  }
  return b;
}

function cadrerSurLieux() {
  if (!carte || (!etat.lieux.length && !etat.zone)) return;
  carte.invalidateSize();
  const b = bornesLocales();
  if (b) carte.fitBounds(b, { padding:[24, 24], maxZoom:14 });
  tracerContours();
}

/* Le contour exact est un simple habillage : il arrive quand il arrive, sans bloquer le cadrage. */
async function tracerContours() {
  if (coucheLimite) { carte.removeLayer(coucheLimite); coucheLimite = null; }
  const formes = [];
  if (etat.zone) {
    const z = etat.zone;
    formes.push({ type:'Polygon', coordinates:[[[z.swlng, z.swlat], [z.nelng, z.swlat],
      [z.nelng, z.nelat], [z.swlng, z.nelat], [z.swlng, z.swlat]]] });
  }
  for (const l of etat.lieux) {
    try {
      const d = await appelDirect('/places/' + l.id, {});
      const p = d.results && d.results[0];
      if (p && p.geometry_geojson) formes.push(p.geometry_geojson);
    } catch (e) { /* ce lieu n'expose pas sa géométrie */ }
  }
  if (!formes.length || !carte) return;
  coucheLimite = L.geoJSON({ type:'GeometryCollection', geometries:formes },
    { style:{ color:'#2F6B4F', weight:1.5, fill:false, dashArray:'5 4' } }).addTo(carte);
  if (!bornesLocales()) {
    const b = coucheLimite.getBounds();
    if (b.isValid()) carte.fitBounds(b, { padding:[24, 24], maxZoom:14 });
  }
}

/* ============================================================
   Onglet Responsabilité
   ============================================================ */

/* La responsabilité compare des parts d'observations entre taxons : une détermination
   arrêtée au genre, qui agrège en réalité plusieurs espèces, fausserait la comparaison.
   Ce tableau ne retient donc que le rang espèce et en dessous. La liste, elle, garde tout :
   « Carabus sp. » reste une information de terrain légitime. */
const RANGS_ESPECE = new Set(['species', 'subspecies', 'variety', 'form', 'hybrid']);

let seuilMin = 1, filtreRouge = false;
let triResp = { col:'part', sens:-1 };
const RESP_PAR_PAGE = 12;
const PIC_PAR_PAGE = 12;
let picPage = 0;
let respPage = 0;   // -1 = décroissant

const COLONNES = {
  nom:  { titre:t('colEspece'), val:l => nomCourt(l.nom, l.nomFr).toLowerCase(), texte:true },
  iucn: { titre:t('colRouge'),  val:l => l.iucn || 0 },

/* Choix du territoire de comparaison. Le changer suppose de refaire les comptages

/* Le bouton n'apparaît que lorsqu'un territoire est effectivement choisi. */
/* Chaque onglet porte une pastille d'état. Les onglets toujours disponibles — liste, carte,
   comparaison — n'en ont pas : leur contenu ne dépend d'aucun calcul différé. */
function majOnglets() {
  const q = etat.qualite;
  const pret = {
    responsabilite: etat.especes.some(e => e.nm && e.nm[q] !== null && e.nm[q] !== undefined),
    saison: !!etat.mensuel,
    decouverte: !!decouvertes,
    disparition: !!disparitions,
    bio: !!bio,
    comm: !!bio        // les communautés se déduisent des mêmes données
  };
  document.querySelectorAll('nav.onglets button').forEach(b => {
    const v = b.dataset.vue;
    if (!(v in pret)) { const p = b.querySelector('.pt'); if (p) p.remove(); return; }
    if (!b.querySelector('.pt')) b.insertAdjacentHTML('beforeend', '<span class="pt"></span>');
    b.classList.toggle('pret', !!pret[v]);
  });
}

function majBoutonRef() {
  const b = $('#r-vider');
  if (b) b.hidden = !etat.reference;
}

async function recalculerReference() {
  majBoutonRef();
  if (!etat.especes.length) return;
  const gen = ++generation;
  $('#r-tableau').innerHTML = `<div class="vide"><strong>${t('recomptage')}</strong>${
    t('recomptageSur', etat.reference ? echap(etat.reference.nom) : t('mondeEntier'))}</div>`;
  try {
    etat.especes.forEach(e => { e.nMonde = null; });
    await chargerEffectifsMondiaux();
    verifier(gen);
    progression(t('mReference', etat.reference ? etat.reference.nom : t('mondeEntier')), null);
    majURL(); enregistrer();
  } catch (e) {
    if (e instanceof Annule) return;
    progression(t('mRecompteEchec'), null);
  }
  dessinerResponsabilite();
}

        const fleche = triResp.col === k ? `<span class="fleche">${triResp.sens < 0 ? '↓' : '↑'}</span>` : '';
        return `<th data-col="${k}"${k === 'part' ? ' style="width:30%"' : ''}>${
          echap(col.titre || nomRef)} ${fleche}</th>`;
      }).join('')}</tr></thead>
      <tbody>${lignes.slice(respPage * RESP_PAR_PAGE, (respPage + 1) * RESP_PAR_PAGE).map(l => {
        const pct = l.part * 100;

        <tr>
          <td class="esp"${l.douteux ? ' title="' + echap(t('respDouteux')) + '"' : ''}
            ><a href="${lienTaxon(l.id, false)}" target="_blank" rel="noopener">
            ${blocNoms(l.nom, l.nomFr)}</a></td>
          <td>${pastilleIUCN(l.iucn)}</td>
          <td class="num"><a href="${lienPortee(l.id, 'zone')}"
            target="_blank" rel="noopener">${nb(l.nZone)}</a></td>
          <td class="num"><a href="${lienPortee(l.id, 'reference')}"
            target="_blank" rel="noopener">${l.douteux ? '?' : nb(l.nMonde)}</a></td>
          <td><div class="mesure" title="${p.nom}">
              <div class="rail"><i style="width:${largeurLog(pct).toFixed(1)}%;
                background:${p.couleur}"></i></div>

              ${l.nZone === l.nMonde ? '<span class="tag excl">' + t('exclusive') + '</span>' : ''}</div></td>

    </table>
    <div class="niveaux">${Object.keys(IUCN).sort((a, b) => b - a)

    <p class="note">${t('noteFloutage')}</p>`;

  const pages = Math.ceil(lignes.length / RESP_PAR_PAGE);

/* ============================================================
   8. Onglet Statistiques
   ============================================================ */

/* Chao1 : n'utilise que les espèces vues une et deux fois (version corrigée du biais). */
/* Les deux estimateurs travaillent sur une simple liste d'effectifs : celle de l'inventaire
   entier, ou celle d'un seul mois tirée de la phénologie. */
function chao1(c = etat.especes.map(e => e.nZone).filter(n => n > 0)) {
  const f1 = c.filter(x => x === 1).length, f2 = c.filter(x => x === 2).length;
  return { s:c.length, f1, f2, est:Math.round(c.length + (f1*(f1-1))/(2*(f2+1))), fiable:f2 >= 5 };
}

/* ACE : exploite toutes les espèces vues dix fois ou moins, donc plus stable. */
function ace(c = etat.especes.map(e => e.nZone).filter(n => n > 0)) {
  const rares = c.filter(x => x <= 10), abondantes = c.length - rares.length;
  const nRares = rares.reduce((a, b) => a + b, 0);
  const F = {}; rares.forEach(x => F[x] = (F[x] || 0) + 1);
  const f1 = F[1] || 0, sRares = rares.length;
  const C = nRares > 0 ? 1 - f1 / nRares : 0;
  if (C <= 0 || nRares < 2) return null;
  let somme = 0; for (let i = 1; i <= 10; i++) somme += i * (i - 1) * (F[i] || 0);
  const g2 = Math.max((sRares / C) * somme / (nRares * (nRares - 1)) - 1, 0);
  return Math.round(abondantes + sRares / C + (f1 / C) * g2);
}

/* Quatre chiffres seulement, en tête de la liste : ce qui est connu, ce qui a été fait pour
   le connaître, et ce qui reste probablement à trouver. */
function bandeauChiffres() {
  if (!etat.especes.length) return '';
  const c1 = chao1(), a = ace();
  // Quand les deux estimateurs s'écartent nettement, c'est l'écart qui compte, pas les chiffres.
  const ecart = (c1.fiable && a) ? Math.abs(a - c1.est) / c1.est : 0;
  const divergent = ecart > 0.15;
  const marque = divergent
    ? ` · <span class="divergent" title="${echap(t('aideDivergent'))}">${t('divergent')}</span>` : '';
  const totalObs = (etat.annees || []).reduce((x, l) => x + l.obs, 0);
  const obsPers = (etat.seriesCache[etat.qualite] || {}).observateurs || 0;
  const debut = (etat.annees || []).length ? etat.annees[0].annee : null;
  return `
    <div class="chiffres">
      <div class="chiffre"><div class="k">${t('espConnues')}</div><div class="v">${nb(c1.s)}</div>
        <div class="d">${t('auMoinsUne')}</div></div>
      <div class="chiffre"><div class="k">${t('observations')}</div>
        <div class="v">${totalObs ? nb(totalObs) : '…'}</div>
        <div class="d">${debut ? t('depuis', debut) : ''}</div></div>
      <div class="chiffre">
        <div class="k">${t('observateurs')}</div>
        <div class="v">${obsPers ? nb(obsPers) : '…'}</div>
        <div class="d">${obsPers && totalObs
          ? t('obsParPers', nb(Math.round(totalObs / obsPers))) : ''}</div></div>
      <div class="chiffre aide" title="${echap(t('aideEstim'))}">
        <div class="k">${t('espEstimees')}</div>
        <div class="v">${c1.fiable || a
          ? '≈ ' + nb(Math.min(...[c1.fiable ? c1.est : null, a].filter(Boolean)))
            + (c1.fiable && a && Math.abs(a - c1.est) > 1
               ? '–' + nb(Math.max(c1.est, a)) : '')
          : '…'}</div>
        <div class="d">${c1.fiable || a
          ? t('completude', Math.round((c1.s / Math.max(...[c1.fiable ? c1.est : null, a]
              .filter(Boolean))) * 100)) + marque
          : t('nonCalculable')}</div></div>
    </div>`;
}





/* ============================================================
   Disparitions : les espèces bien connues qui ne sont plus revues
   ============================================================ */

/* Le miroir des découvertes, et il partage sa première requête : la liste des espèces vues
   pendant les cinq dernières années. Les découvertes en retranchent le passé, les disparitions
   la retranchent du présent. L'appel étant identique, il est servi par le cache — cet onglet
   ne coûte donc que la datation de ce qu'il affiche.
   Le seuil de cinq signalements est essentiel : sans lui la liste se remplirait d'espèces vues
   une seule fois il y a dix ans, dont l'absence ne veut rien dire. */
let disparitions = null, disEnCours = false;
let disRouge = false;       // n'afficher que les espèces menacées
let disMin = 1;              // signalements minimum ; à 1, rien n'est écarté
let disMois = 24;            // durée d'absence effectivement retenue
const DIS_PAR_PAGE = 12;     // fiches par page
const DIS_PLAFOND = 96;      // datation maximale : chaque espèce coûte une requête
let disPage = 0;
const DIS_FENETRES = [24, 36, 60, 120];   // mois d'absence exigés, du plus court au plus long

/* Temps écoulé depuis la dernière observation, en années et mois. */
/* Durée en toutes lettres, à partir d'un nombre de mois. */
function dureeTexte(mois) {
  const ans = Math.floor(mois / 12), reste = mois % 12, bouts = [];
  if (ans) bouts.push(ans + ' ' + t(ans > 1 ? 'uniteAns' : 'uniteAn'));
  if (reste || !ans) bouts.push(reste + ' ' + t(reste > 1 ? 'uniteMoisP' : 'uniteMois'));
  return bouts.join(' ');
}

function depuisQuand(date) {
  const d = new Date(date);
  if (isNaN(d.getTime())) return '';
  const n = new Date();
  let mois = (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth());
  if (n.getDate() < d.getDate()) mois--;
  if (mois < 0) mois = 0;
  const ans = Math.floor(mois / 12), reste = mois % 12;
  const bouts = [];
  if (ans) bouts.push(ans + ' ' + t(ans > 1 ? 'uniteAns' : 'uniteAn'));
  if (reste || !ans) bouts.push(reste + ' ' + t(reste > 1 ? 'uniteMoisP' : 'uniteMois'));
  return bouts.join(' ');
}

async function chargerDisparitions() {
  if (disEnCours || !etat.especes.length) return;
  disEnCours = true;
  const gen = generation;
  const f = filtres();

  /* Les espèces vues pendant une période donnée. Celle de cinq ans est déjà en cache,
     puisque les découvertes l'ont demandée. */
  async function vuesDepuis(mois) {
    const vues = new Set();
    // Jusqu'à épuisement : une liste tronquée ferait passer pour absentes des espèces vues hier.
    for (let page = 1; page <= 20; page++) {
      const d = await comptages({ ...f, d1:jour(ilYa(mois)), per_page:500, page },
        !(await testerMoisV2(f)));
      verifier(gen);
      d.results.forEach(r => vues.add(r.taxon.id));
      if (d.results.length < 500) break;
    }
    return vues;
  }

  try {
    dessinerDisparitions();
    progression(t('disCharge'), 15);

    /* On allonge l'absence exigée par paliers, jusqu'à obtenir une liste assez courte pour
       être datée en entier. Exiger plus longtemps réduit le nombre de candidates et renforce
       le signal : une espèce muette depuis cinq ans dit plus qu'une espèce muette depuis deux.
       La liste correspond ainsi exactement à une durée, celle qui est annoncée. */
    /* Chaque palier isole une tranche d'absence : plus de dix ans, puis de cinq à dix, et
       ainsi de suite. On les empile de la plus longue à la plus courte, ce qui classe les
       espèces par durée d'absence sans avoir daté quoi que ce soit. */
    const tranches = [];
    let limite = null;
    for (const mois of DIS_FENETRES) {
      progression(t('disCharge'), 10 + (DIS_FENETRES.indexOf(mois) / DIS_FENETRES.length) * 50);
      const vues = await vuesDepuis(mois);
      verifier(gen);
      tranches.push({ mois, absentes: etat.especes.filter(e => e.nZone >= disMin && !vues.has(e.id)) });
      if (limite === null) { limite = jour(ilYa(mois)); disMois = mois; }
    }

    const vus = new Set();
    let candidates = [];
    for (const tr of [...tranches].reverse()) {          // la plus longue absence d'abord
      const nouveaux = tr.absentes.filter(e => !vus.has(e.id));
      nouveaux.forEach(e => vus.add(e.id));
      candidates = candidates.concat(nouveaux.sort((a, b) => b.nZone - a.nZone));
      if (candidates.length >= DIS_PLAFOND) break;
    }
    candidates = candidates.slice(0, DIS_PLAFOND);

    if (!candidates.length) {
      disparitions = [];
      progression(t('mComplet'), null);
      return;                       // le rendu final a lieu dans le bloc « finally »
    }

    const liste = [];
    for (let i = 0; i < candidates.length; i++) {
      progression(t('disCharge'), 30 + (i / candidates.length) * 65);
      /* La requête est bornée par d2 : elle ne peut renvoyer qu'une observation antérieure à
         la limite, quel que soit le tri appliqué par le serveur. Se fier au seul order_by
         laissait passer des espèces revues récemment quand le tri n'était pas honoré. */
      const o = await premiereObs({ ...f, taxon_id:candidates[i].id, d2:limite }, 'desc');
      verifier(gen);
      if (o && o.date && o.date <= limite) liste.push({ e:candidates[i], obs:o.obs, date:o.date });
      else if (o) console.warn('Disparitions : date inattendue écartée', candidates[i].nom, o.date);
    }
    liste.sort((a, b) => String(a.date).localeCompare(String(b.date)));

    disparitions = liste; disPage = 0;
    progression(t('mComplet'), null);
  } catch (e) {
    if (!(e instanceof Annule)) progression(t('mEchec', String(e.message || e)), null);
  } finally {
    // L'état doit être à jour avant le dernier rendu, sinon l'écran reste sur « recherche… ».
    disEnCours = false;
    dessinerDisparitions();
  }
}

function dessinerDisparitions() {
  const v = $('#v-disparition');
  if (!etat.especes.length) return;
  if (!disparitions && !disEnCours) {
    v.innerHTML = `<div class="outils">
        <button class="primaire" id="dis-lancer">${t('lancerRecherche')}</button>
        <span class="compte">${t('coutRequetes', 25)}</span>
      </div>
      <div class="vide">${t('videDisparition')}</div>
      <p class="note">${t('disNote')}</p>`;
    $('#dis-lancer').addEventListener('click', () => enTache(chargerDisparitions));
    return;
  }
  const toutes = disparitions || [];
  // Vulnérable, en danger, en danger critique, éteinte à l'état sauvage ou éteinte.
  const liste = disRouge ? toutes.filter(x => x.e.iucn >= 30) : toutes;

  v.innerHTML = `
    <div class="outils">
      ${toutes.some(x => x.e.iucn >= 30) ? `<select id="d-rouge">
        <option value=""${disRouge ? '' : ' selected'}>${t('disFiltreTout')}</option>
        <option value="1"${disRouge ? ' selected' : ''}>${t('disFiltreRouge')}</option>
      </select>` : ''}
      <select id="d-seuil">${[1, 2, 5, 10, 20].map(v =>
        `<option value="${v}"${v === disMin ? ' selected' : ''}>${t('seuilObs', v)}</option>`).join('')}</select>
      <span class="compte">${liste.length ? t('disNb', nb(liste.length))
        : (disEnCours ? t('disCharge') : '')}</span>
    </div>
    ${liste.length ? `<div class="planche">${liste.slice(disPage * DIS_PAR_PAGE,
      (disPage + 1) * DIS_PAR_PAGE).map(x => `
      <div class="fiche" title="${t('disDerniere')} ${echap(x.date)}"
         ${IUCN[x.e.iucn] ? `style="border-color:${IUCN[x.e.iucn].bg};
           box-shadow:inset 0 0 0 1px ${IUCN[x.e.iucn].bg}"` : ''}>
        ${boutonPanier(x.e.id)}
        <a class="img" href="https://www.inaturalist.org/observations/${x.obs}"
           target="_blank" rel="noopener">${x.e.photo
          ? `<img src="${vignette(x.e)}" loading="lazy" decoding="async" alt="">`
          : ''}<span class="num">${depuisQuand(x.date)}</span>
          ${x.e.iucn ? `<span class="statut">${pastilleIUCN(x.e.iucn)}</span>` : ''}</a>
        <div class="corps">${blocNoms(x.e.nom, x.e.nomFr)}
          <div class="date">${nb(x.e.nZone)} ${t('obs')}</div></div>
      </div>`).join('')}</div>`
      : `<div class="vide">${disEnCours ? t('disCharge') : t('disVide')}</div>`}
    ${liste.length > DIS_PAR_PAGE ? `<div class="outils" style="margin-top:16px">
      <button class="discret" id="d-prec"${disPage === 0 ? ' disabled' : ''}>‹</button>
      <span class="compte" style="margin-left:0">${disPage + 1} / ${
        Math.ceil(liste.length / DIS_PAR_PAGE)}</span>
      <button class="discret" id="d-suiv"${(disPage + 1) * DIS_PAR_PAGE >= liste.length
        ? ' disabled' : ''}>›</button>
    </div>` : ''}
    <p class="note">${t('disNote')}</p>`;

  brancherPanier(v, dessinerDisparitions);
  const dr = $('#d-rouge');
  if (dr) dr.addEventListener('change', e => {
    disRouge = !!e.target.value; disPage = 0; dessinerDisparitions();
  });
  const prec = $('#d-prec'), suiv = $('#d-suiv');
  if (prec) prec.addEventListener('click', () => { disPage--; dessinerDisparitions(); });
  if (suiv) suiv.addEventListener('click', () => { disPage++; dessinerDisparitions(); });

  const sel = $('#d-seuil');
  if (sel) sel.addEventListener('change', e => {
    disMin = +e.target.value;
    disparitions = null; disPage = 0;
    enTache(chargerDisparitions);
  });
}


/* ============================================================
   Comparaison : plusieurs espèces côte à côte, sous le même filtre
   ============================================================ */

/* Les annotations d'iNaturalist — sexe, stade de vie, phénologie des plantes — ne sont pas
   devinées : on demande le vocabulaire au serveur, qui renvoie les libellés déjà traduits.
   On l'interroge pour la première espèce du panier plutôt qu'en général : le menu ne propose
   alors que ce qui s'applique réellement, la floraison pour une plante, le sexe et le stade
   pour un animal. C'est aussi ainsi qu'apparaît « pas de floraison », l'annotation qui isole
   les individus sans fleur. */
let vocabulaire = null, vocabulairePour = null;
let cpAnnot = '';          // « termeId:valeurId », vide pour toutes les photos
let cpLocal = false;
const cachePhotos = new Map();

   quelle que soit la langue demandée. On les traduit donc ici, en retombant sur l'original

const ANNOTATIONS = {

     intermédiaire. Les libellés lèvent l'ambiguïté plutôt que de la reporter sur l'utilisateur. */
  'pupa':{fr:"Chrysalide ou pupe",es:"Pupa o crisálida",it:"Pupa o crisalide",de:"Puppe"},
