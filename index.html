<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cequivitici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --papier:#E9EDE5; --carte:#FBFCF9; --encre:#14231C; --encre-2:#5D6E63; --encre-3:#8B9990;
  --trait:#C6CEC1; --vert:#2F6B4F; --ocre:#A87C14; --prune:#7B3B52; --r:3px;
}
*{box-sizing:border-box}
/* Un sélecteur d'identifiant l'emporte sur la règle par défaut du navigateur : sans cette
   ligne, tout élément « hidden » doté d'un display explicite reste visible. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--papier); color:var(--encre);
  font-family:'Karla',system-ui,sans-serif; font-size:15px; line-height:1.6}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; font-weight:600; line-height:1.15; margin:0}
a{color:inherit}
.wrap{max-width:1240px; margin:0 auto; padding:0 24px}

header{border-bottom:1px solid var(--trait); padding:38px 0 26px; margin-bottom:28px}
h1{font-size:clamp(30px,4.4vw,46px); letter-spacing:-.015em}
h1 em{font-style:italic; color:var(--vert)}
.sub{color:var(--encre-2); max-width:60ch; margin-top:10px}

.panneau{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r); padding:20px 22px}
.champs{display:grid; grid-template-columns:1fr 1fr; gap:22px}
@media(max-width:720px){.champs{grid-template-columns:1fr}}
label.tit{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--encre-3); margin-bottom:7px}
.saisie{position:relative}
input[type=text]{width:100%; padding:9px 11px; border:1px solid var(--trait);
  border-radius:var(--r); background:#fff; font:inherit; color:var(--encre)}
input[type=text]:focus{outline:2px solid var(--vert); outline-offset:1px; border-color:var(--vert)}
.propositions{position:absolute; z-index:900; left:0; right:0; top:calc(100% + 3px); background:#fff;
  border:1px solid var(--trait); border-radius:var(--r); max-height:270px; overflow:auto; display:none;
  box-shadow:0 6px 18px rgba(20,35,28,.09)}
.propositions.on{display:block}
.prop{padding:8px 11px; cursor:pointer; border-bottom:1px solid #EEF1EC; font-size:14px}
.prop:last-child{border-bottom:0}
.prop:hover,.prop.vise{background:#EDF2EC}
.prop small{display:block; color:var(--encre-3); font-size:12px}
#q-lieu{padding-right:36px}
.saisie .icone{position:absolute; right:5px; top:50%; transform:translateY(-50%);
  border:0; background:transparent; color:var(--encre-3); cursor:pointer;
  padding:4px; line-height:0; border-radius:3px}
.saisie .icone:hover{color:var(--vert); background:#EDF2EC}
#memoire{margin:14px 0 4px; border:1px solid var(--trait); border-radius:var(--r);
  padding:12px 14px; background:#F4F7F3}
#memoire .ligne{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:7px 0; border-top:1px solid var(--trait)}
#memoire .ligne:first-child{border-top:0}
#memoire .quoi{flex:1; min-width:0}
#memoire .quoi b{font-weight:700}
#memoire .quand{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--encre-3)}
#memoire button{margin-left:8px}
.icone-liste{padding:6px 8px; line-height:0}
#stop{color:var(--prune)}
#stop:hover{border-color:var(--prune); background:#F6EEF3}
.jetons{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; min-height:4px}
.jeton{display:inline-flex; align-items:center; gap:7px; background:#E4EBE1; border:1px solid var(--trait);
  border-radius:20px; padding:3px 5px 3px 12px; font-size:13px}
.jeton button{border:0; background:transparent; cursor:pointer; color:var(--encre-2);
  font-size:15px; line-height:1; padding:2px 5px; border-radius:50%}
.jeton button:hover{background:#D2DCCE; color:var(--encre)}

.barre-actions{display:flex; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap}
button.primaire{background:var(--vert); color:#fff; border:0; border-radius:var(--r);
  padding:11px 22px; font:inherit; font-weight:700; cursor:pointer}
button.primaire:hover{background:#255840}
button.primaire:disabled{background:var(--encre-3); cursor:not-allowed}
button.discret{background:#fff; color:var(--encre); border:1px solid var(--trait);
  border-radius:var(--r); padding:8px 15px; font:inherit; cursor:pointer}
button.discret:hover{border-color:var(--vert); color:var(--vert)}
.etat{font-size:13px; color:var(--encre-2); font-family:'IBM Plex Mono',monospace; flex:1 1 210px}
.jauge{height:2px; background:var(--trait); margin-top:14px; overflow:hidden; display:none}
.jauge.on{display:block}
.jauge i{display:block; height:100%; background:var(--vert); width:0; transition:width .25s}

nav.onglets{display:flex; gap:2px; border-bottom:1px solid var(--trait); margin:34px 0 24px; flex-wrap:wrap}
nav.onglets button{border:0; background:transparent; font:inherit; cursor:pointer; padding:11px 18px;
  color:var(--encre-2); border-bottom:2px solid transparent; margin-bottom:-1px}
nav.onglets button:hover{color:var(--encre)}
nav.onglets button.actif{color:var(--encre); border-bottom-color:var(--vert); font-weight:700}
section.vue{display:none} section.vue.actif{display:block}

.vide{border:1px dashed var(--trait); border-radius:var(--r); padding:52px 24px;
  text-align:center; color:var(--encre-2)}
.vide strong{display:block; font-family:'Fraunces',serif; font-size:19px; color:var(--encre); margin-bottom:6px}
.alerte{background:#FBF3DC; border-left:3px solid var(--ocre); padding:11px 15px; font-size:14px; margin-bottom:20px}

.outils{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.outils input[type=text]{width:210px}
select option:disabled{color:var(--encre-3)}
select{padding:8px 10px; border:1px solid var(--trait); border-radius:var(--r); background:#fff; font:inherit}
.compte{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--encre-3); margin-left:auto}

.expl{display:grid; grid-template-columns:262px 1fr; gap:26px; align-items:start}
@media(max-width:900px){.expl{grid-template-columns:1fr}}
.arbre{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r);
  padding:12px 10px; position:sticky; top:14px; max-height:78vh; overflow:auto}
@media(max-width:900px){.arbre{position:static; max-height:300px}}
.arbre .entete{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--encre-3); padding:2px 8px 10px}
.n-ligne{display:flex; align-items:center; gap:2px; border-radius:2px}
.n-ligne:hover{background:#EEF2EC}
.n-ligne.sel{background:#E0EAE0}
.n-ligne.sel .n-nom{color:var(--vert); font-weight:700}
.n-plier{border:0; background:transparent; cursor:pointer; width:18px; padding:0; color:var(--encre-3);
  font-size:10px; line-height:1; flex:none}
.n-plier.creux{visibility:hidden}
.n-nom{flex:1; border:0; background:transparent; font:inherit; font-size:13.5px; text-align:left;
  cursor:pointer; padding:3px 2px; color:var(--encre); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.n-nb{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--encre-3); padding-right:6px; flex:none}
.n-enfants{margin-left:13px; border-left:1px solid #E1E7DE; padding-left:3px}
.n-enfants.plie{display:none}
.n-rang{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--encre-3);
  text-transform:uppercase; letter-spacing:.06em; margin-left:5px}

#loupe{position:fixed; inset:0; z-index:2000; background:rgba(20,35,28,.88);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:24px; cursor:zoom-out}
#loupe-bande{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%;
  scrollbar-width:none; border-radius:var(--r)}
#loupe-bande::-webkit-scrollbar{display:none}
#loupe-bande img{flex:0 0 100%; width:100%; max-height:78vh; object-fit:contain;
  scroll-snap-align:center}
#loupe .fleche{position:absolute; top:50%; transform:translateY(-50%); z-index:1;
  border:0; background:rgba(251,252,249,.9); color:var(--encre); cursor:pointer;
  width:38px; height:38px; border-radius:50%; font-size:22px; line-height:1; padding:0}
#loupe-prec{left:16px} #loupe-suiv{right:16px}
#loupe .fleche[hidden]{display:none !important}
#loupe a{color:#fff; font-size:13px; border-bottom:1px dotted rgba(255,255,255,.6);
  text-decoration:none}
.colonne .actions{display:flex; gap:3px; flex:none}
.colonne .freq{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--vert);
  margin-top:4px}
.colonne .pheno{padding:6px 8px 2px; border-bottom:1px solid var(--trait)}
.colonne .photos a{cursor:zoom-in}
.colonnes{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,290px);
  gap:16px; overflow-x:auto; align-items:start; justify-content:start}
/* Barre de défilement dupliquée au-dessus, synchronisée avec les colonnes. La rotation à
   180 degrés, plus courte à écrire, inversait l'ordre des colonnes et les collait à droite. */
#cp-defil{overflow-x:auto; overflow-y:hidden; height:14px; margin-bottom:6px}
#cp-defil div{height:1px}
.colonne{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r);
  overflow:hidden}
.colonne .entete{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  padding:10px 11px; border-bottom:1px solid var(--trait)}
.colonne .entete .fr{font-weight:700; font-size:14px; line-height:1.3}
.colonne .entete .sci{font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--encre-2)}
.colonne .photos{display:grid; gap:1px; background:var(--trait)}
.colonne .obs{position:relative; background:#DDE4D9}
/* Défilement latéral par accrochage : glisser au doigt sur téléphone, à la molette ou au
   pavé sur ordinateur, sans aucun script. */
.colonne .defile{display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  scrollbar-width:none}
.colonne .defile::-webkit-scrollbar{display:none}
.colonne .defile img{flex:0 0 100%; width:100%; aspect-ratio:1; object-fit:cover; display:block;
  scroll-snap-align:start; cursor:zoom-in}
.colonne .pages{position:absolute; left:0; right:0; bottom:16px; display:flex;
  justify-content:center; gap:4px; pointer-events:none}
.colonne .pages i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.5);
  box-shadow:0 0 0 1px rgba(20,35,28,.35)}
.colonne .pages i.on{background:#fff; box-shadow:0 0 0 1px rgba(20,35,28,.55)}
.colonne .photos .credit{position:absolute; left:0; right:0; bottom:0; font-size:8.5px;
  color:#fff; background:rgba(20,35,28,.55); padding:2px 5px; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media(max-width:640px){.colonnes{grid-auto-columns:minmax(150px,1fr)}}
.planche{display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:16px}
.fiche{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit;
  transition:border-color .12s}
.fiche:hover{border-color:var(--vert)}
.fiche.mondiale{border-color:#C9A227; box-shadow:0 0 0 3px rgba(201,162,39,.28)}
.fiche .drapeau{position:absolute; bottom:0; left:0; right:0; background:#C9A227; color:#3A2E06;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em;
  text-align:center; padding:2px 4px; text-transform:uppercase}
.fiche .date{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--encre-2)}
.fiche .img{aspect-ratio:1; background:#DDE4D9; position:relative; overflow:hidden}
.fiche .img:empty::after, .fiche .img:not(:has(img))::after{content:'—'; position:absolute;
  inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--encre-3); font-size:20px}
.fiche .img img{width:100%; height:100%; object-fit:cover; display:block}
.fiche .num{position:absolute; top:6px; left:6px; background:rgba(20,35,28,.72); color:#fff;
  font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 6px; border-radius:2px}
.fiche .statut{position:absolute; bottom:6px; right:6px}
.fiche .statut .iucn{font-size:10px; padding:2px 6px 2px 4px}
.fiche{position:relative}
.fiche .corps{padding:10px 11px 11px; display:flex; flex-direction:column; gap:3px; flex:1}
.fiche .img{display:block}
.fiche .bas{display:flex; align-items:flex-end; justify-content:space-between; gap:6px;
  margin-top:auto; padding-top:6px}
.fiche .n{text-decoration:none}
.fiche .n:hover{text-decoration:underline}
.fiche .plus{border:1px solid var(--trait); background:#fff; color:var(--encre-2); cursor:pointer;
  width:20px; height:20px; border-radius:3px; line-height:1; font-size:14px; padding:0; flex:none}
.fiche .plus:hover{border-color:var(--vert); color:var(--vert)}
.fiche .choisir{position:absolute; top:6px; right:6px; z-index:1; width:24px; height:24px;
  border:1px solid rgba(20,35,28,.25); background:rgba(255,255,255,.92); color:var(--encre-2);
  border-radius:4px; cursor:pointer; font-size:14px; line-height:1; padding:0}
.fiche .choisir:hover{border-color:var(--vert); color:var(--vert)}
.fiche .choisir.pris{background:var(--vert); border-color:var(--vert); color:#fff}
.fiche .taxo{position:absolute; inset:0; background:rgba(251,252,249,.975); padding:9px 10px;
  overflow:auto; display:none; z-index:2; cursor:pointer}
.fiche.ouvert .taxo{display:block}
.fiche .lig{font-size:11.5px; line-height:1.35; color:var(--encre-2); border-left:3px solid;
  margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fiche .lig.actif{color:var(--encre); font-weight:700}
.fiche .rg{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--encre-3); display:block}
.fiche .fr{font-weight:700; font-size:14px; line-height:1.3}
.fiche .sci{font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--encre-2)}
.fr.lat{font-family:'Fraunces',serif; font-style:italic; font-weight:400}
.sci.romain{font-family:'Karla',sans-serif; font-style:normal}
.n-nom.lat{font-family:'Fraunces',serif; font-style:italic}
.fiche .n{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--vert); margin-top:auto; padding-top:6px}
.fiche .credit{font-size:9px; color:var(--encre-3); line-height:1.3; padding:0 11px 8px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Sur téléphone, trois fiches par ligne. Les cartes se resserrent en conséquence :
   texte plus petit, marges réduites, et le crédit photo passe sur deux lignes au lieu
   d'être tronqué à un mot — l'attribution doit rester lisible. */
@media(max-width:640px){
  .wrap{padding:0 14px}
  .planche{grid-template-columns:repeat(3,1fr); gap:9px}
  .fiche .corps{padding:7px 8px 8px; gap:2px}
  .fiche .fr{font-size:12px; line-height:1.25}
  .fiche .sci{font-size:11px; line-height:1.25}
  .fiche .n{font-size:10.5px; padding-top:5px}
  .fiche .num{font-size:9px; padding:1px 4px; top:4px; left:4px}
    .fiche .statut{bottom:4px; right:4px}
  .fiche .statut .iucn{font-size:9px; padding:1px 4px 1px 3px; gap:3px}
  .fiche .credit{font-size:8.5px; padding:0 8px 7px; white-space:normal;
    max-height:2.6em; line-height:1.3}
  .arbre{max-height:230px}
  .outils{gap:9px}
  .outils input[type=text]{width:100%}
  .outils .saisie{width:100% !important}
  .compte{margin-left:0}
}

table{width:100%; border-collapse:collapse; background:var(--carte); font-size:14px}
th[data-col]{cursor:pointer; user-select:none}
th[data-col]:hover{color:var(--encre)}
th .fleche{color:var(--vert); font-size:11px}
th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--encre-3); font-weight:500; padding:10px 12px;
  border-bottom:1px solid var(--trait); white-space:nowrap}
td{padding:9px 12px; border-bottom:1px solid #EDF0EA; vertical-align:middle}
tr:hover td{background:#F3F6F1}
td.esp .fr{font-weight:700} td.esp .sci{font-family:'Fraunces',serif; font-style:italic;
  color:var(--encre-2); font-size:13px}
td.esp a{text-decoration:none} td.esp a:hover .fr{color:var(--vert); text-decoration:underline}
td.num{font-family:'IBM Plex Mono',monospace; text-align:right; white-space:nowrap}
td.num a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--trait)}
td.num a:hover{color:var(--vert); border-bottom-color:var(--vert)}
.mesure{display:flex; align-items:center; gap:9px}
.mesure .rail{flex:1; height:6px; background:#E4EAE1; border-radius:3px; overflow:hidden;
  min-width:52px; background-image:repeating-linear-gradient(90deg,
    transparent 0 calc(33.333% - 1px), #CBD5C7 calc(33.333% - 1px) 33.333%)}
.mesure .rail i{display:block; height:100%; background:var(--ocre)}
.mesure .val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; width:64px; text-align:right}
.tag{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:2px; white-space:nowrap}
.tag.excl{background:#F1E1E7; color:var(--prune)}
.tag.faible{background:#E7EAE5; color:var(--encre-3)}

.iucn{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
  font-size:10.5px; font-weight:500; letter-spacing:.04em; padding:2px 7px 2px 5px;
  border-radius:2px; white-space:nowrap}
.iucn svg{flex:none}
.iucn.vide{background:transparent; color:var(--encre-3); padding-left:7px}
.niveaux{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--encre-2); margin-top:14px}
.niveaux span{display:flex; align-items:center; gap:6px}
.niveaux i{width:13px; height:8px; border-radius:2px; display:inline-block}

.chiffres{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:16px; margin-bottom:26px}
.chiffre{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r); padding:15px 17px}
.chiffre.aide{cursor:help}
.divergent{color:var(--ocre); border-bottom:1px dotted var(--ocre); cursor:help}
.chiffre.aide .k{border-bottom:1px dotted var(--encre-3); display:inline-block; padding-bottom:1px}
.chiffre .k{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--encre-3)}
.chiffre .v{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.1; margin-top:5px}
.chiffre .d{font-size:12.5px; color:var(--encre-2); margin-top:3px}
.graphe{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r); padding:20px}
.titre-graphe{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--encre-3); margin:30px 0 10px}
.legende{display:flex; gap:22px; font-size:14px; color:var(--encre-2); margin-top:12px; flex-wrap:wrap}
.legende span{display:flex; align-items:center; gap:7px}
.legende i{width:18px; height:5px; border-radius:2px; display:inline-block}
.note{font-size:13px; color:var(--encre-2); margin-top:16px; max-width:72ch}

#carte-lieu{height:300px; border:1px solid var(--trait); border-radius:var(--r); background:#DDE4D9}
#lieux-trouves .jeton{cursor:pointer}
#lieux-trouves .jeton:hover{background:#D2DCCE; border-color:var(--vert)}
#lieux-trouves .jeton small{color:var(--encre-3); font-size:11px; margin-left:6px}
/* Une légende posée sur la carte plutôt qu'en dessous : c'est là qu'on la cherche, et elle
   reste visible pendant qu'on déplace la vue. */
.carte-boite{position:relative}
.sur-carte{position:absolute; top:10px; right:10px; z-index:500; width:32px; height:32px;
  display:flex; align-items:center; justify-content:center; padding:0;
  background:rgba(251,252,249,.94); border:1px solid var(--trait); border-radius:var(--r);
  color:var(--encre-2); cursor:pointer; box-shadow:0 2px 8px rgba(20,35,28,.12)}
.sur-carte:hover{color:var(--vert); border-color:var(--vert)}
.sur-carte.actif{background:var(--vert); border-color:var(--vert); color:#fff}
#c-legende-carte{position:absolute; bottom:14px; left:10px; z-index:500; max-width:60%;
  background:rgba(251,252,249,.94); border:1px solid var(--trait); border-radius:var(--r);
  padding:8px 10px; font-size:12.5px; line-height:1.5;
  box-shadow:0 2px 10px rgba(20,35,28,.12)}
#c-legende-carte div{display:flex; align-items:center; gap:7px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#carte{height:min(72vh,620px); border:1px solid var(--trait); border-radius:var(--r); background:#DDE4D9}
.fond-clair{filter:grayscale(.92) brightness(1.07) contrast(.88)}
.fond-effort{filter:grayscale(1) contrast(.6); opacity:.38}
.bascule{display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--encre-2); cursor:pointer}
.bascule input{accent-color:var(--vert); width:15px; height:15px; cursor:pointer}
.pop-tit{font-weight:700; margin-bottom:2px}
.pop-sous{color:#5D6E63; font-size:11.5px; margin-bottom:7px}
.pop-liste{list-style:none; margin:0; padding:0; font-size:13px}
.pop-liste li{display:flex; justify-content:space-between; gap:12px; padding:2px 0;
  border-bottom:1px solid #EDF0EA}
.pop-liste li:last-child{border-bottom:0}
.pop-liste b{font-family:'IBM Plex Mono',monospace; font-weight:500; color:#2F6B4F}
.pop-liste i{font-family:'Fraunces',serif; color:#5D6E63}
.leaflet-container{font-family:'Karla',sans-serif; font-size:12px; background:#DDE4D9}

footer{border-top:1px solid var(--trait); margin-top:60px; padding:22px 0 44px;
  font-size:12.5px; color:var(--encre-3)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div style="display:flex; justify-content:flex-end">
      <select id="f-langue" aria-label="Langue"></select>
    </div>
    <h1><span data-t="h1a">Cequivit</span><em data-t="h1b">ici</em></h1>
    <p class="sub" data-t="sous"></p>
  </div>
</header>

<div class="wrap">

  <div class="panneau">

    <div class="champs">
      <div>
        <label class="tit" for="q-taxon" data-t="groupes">Groupes</label>
        <div class="saisie">
          <input type="text" id="q-taxon" data-tp="phTaxon" autocomplete="off">
          <div class="propositions" id="p-taxon"></div>
        </div>
        <div class="jetons" id="j-taxon"></div>
      </div>
      <div>
        <label class="tit" for="q-lieu" data-t="lieux">Lieux</label>
        <div class="saisie">
          <input type="text" id="q-lieu" data-tp="phLieu" autocomplete="off">
          <button id="ouvrir-carte" class="icone" data-tt="choisirCarte">
            <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <path d="M10 1.6c-2.9 0-5.2 2.3-5.2 5.2 0 3.8 5.2 11.6 5.2 11.6s5.2-7.8 5.2-11.6
                c0-2.9-2.3-5.2-5.2-5.2z" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linejoin="round"/>
              <circle cx="10" cy="6.8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
          <div class="propositions" id="p-lieu"></div>
        </div>
        <div class="jetons" id="j-lieu"></div>
        <div id="selecteur" hidden>
          <div class="outils" style="margin:10px 0 8px">
            <button class="discret" id="ma-position" data-t="maPosition">Ma position</button>
            <button class="discret" id="zone-vue" data-t="zoneVue">Utiliser cette vue</button>
            <button class="discret" id="fermer-carte" data-t="fermerCarte">Fermer</button>
          </div>
          <div id="carte-lieu"></div>
          <div class="tit" style="margin:12px 0 6px" data-t="lieuxIci"></div>
          <div id="lieux-trouves" class="jetons"></div>
        </div>
      </div>
    </div>
    <div class="barre-actions">
      <button class="primaire" id="lancer" data-t="charger">Charger</button>
      <select id="f-qualite" aria-label="Niveau de validation des observations">
        <option value="research" data-t="valid">Observations validées</option>
        <option value="toutes" data-t="toutesObs">Toutes les observations</option>
      </select>
      <select id="f-nommage" aria-label="Nomenclature affichée">
        <option value="sci" data-t="nomsSci" selected>Noms scientifiques</option>
        <option value="fr" data-t="nomsCom">Noms vernaculaires</option>
      </select>
      <span class="etat" id="etat" data-t="choisirLieu"></span>
      <button class="discret icone-liste" id="stop" data-tt="arreter" hidden>
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
          <rect x="4.5" y="4.5" width="11" height="11" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button class="discret icone-liste" id="voir-memoire" data-tt="memVoir">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path d="M3.5 3.5h10L16.5 6.5v10h-13z" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M6.5 3.5v4h6v-4M6.5 16.5v-4h7v4" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div id="memoire" hidden>
      <div class="tit" style="margin:0 0 8px" data-t="memTitre"></div>
      <div id="memoire-liste"></div>
      <button class="discret" id="vider" data-t="viderMem"
        style="margin-top:12px">Vider la mémoire</button>
    </div>

    <div class="jauge" id="jauge"><i></i></div>
  </div>

  <nav class="onglets">
    <button class="actif" data-vue="liste" data-t="oListe">Liste</button>
    <button data-vue="comparaison" data-t="oComparaison">Comparaison</button>
    <button data-vue="responsabilite" data-t="oResp">Responsabilité</button>
    <button data-vue="saison" data-t="oSaison">Saisonnalité</button>
    <button data-vue="decouverte" data-t="oDecouverte">Découvertes</button>
    <button data-vue="disparition" data-t="oDisparition">Disparitions</button>
    <button data-vue="carte" data-t="oCarte">Carte</button>
  </nav>

  <section class="vue actif" id="v-liste">
    <div class="vide"><strong data-t="rienCharge"></strong><span data-t="videListe"></span></div>
  </section>

  <section class="vue" id="v-carte">
    <div class="outils">
      <select id="c-rendu" aria-label="rendu"></select>
      <label class="bascule"><input type="checkbox" id="c-precis">
        <span data-t="cPrecis">Positions exactes</span></label>
      <label class="bascule"><input type="checkbox" id="c-panier">
        <span data-t="cPanier">Sélection</span></label>
      <label class="bascule"><input type="checkbox" id="c-effort">
        <span data-t="cEffort">Fond d'effort</span></label>
      <button class="discret" id="c-recadrer" data-t="recadrer">Recadrer</button>
    </div>
    <div class="carte-boite">
      <div id="carte"></div>
      <div id="c-legende-carte" hidden></div>
      <button id="c-fond" class="sur-carte" data-tt="cFond">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path d="M10 2.4 2.6 6.2 10 10l7.4-3.8z" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M3.4 9.6 10 13l6.6-3.4M3.4 13.2 10 16.6l6.6-3.4" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="note" data-t="cNoteCouleurs"></p>
    <p class="note"><strong data-t="carteClic"></strong> <span data-t="carteClicFin"></span></p>
  </section>

  <section class="vue" id="v-comparaison">
    <div class="vide"><strong data-t="oComparaison"></strong><span data-t="videComparaison"></span></div>
  </section>

  <section class="vue" id="v-responsabilite">
    <p class="note" style="margin:0 0 14px" data-t="respIntro"></p>
    <div class="outils">
      <label class="tit" for="r-ref" style="margin:0" data-t="comparerA">Comparer à</label>
      <div class="saisie" style="width:240px">
        <input type="text" id="r-ref" autocomplete="off" data-tp="phRef">
        <div class="propositions" id="r-ref-liste"></div>
      </div>
      <button class="discret" id="r-vider" data-t="retirerRef" hidden>Revenir au monde entier</button>
      <select id="f-seuil" aria-label="seuil"></select>
      <select id="f-rouge">
        <option value="0" data-t="toutesEsp">Toutes les espèces</option>
        <option value="1" data-t="menaceesSeul">Menacées</option>
      </select>
      <span class="compte" id="r-compte"></span>
    </div>
    <div id="r-tableau">
      <div class="vide"><strong data-t="rienCharge"></strong><span data-t="videResp"></span></div>
    </div>
  </section>
  <section class="vue" id="v-decouverte">
    <div class="vide"><strong data-t="rienCharge"></strong><span data-t="videDecouverte"></span></div>
  </section>

  <section class="vue" id="v-disparition">
    <div class="vide"><strong data-t="rienCharge"></strong><span data-t="videDisparition"></span></div>
  </section>

  <section class="vue" id="v-saison">
    <div class="vide"><strong data-t="rienCharge"></strong><span data-t="videSaison"></span></div>
  </section>

  <div id="loupe" hidden>
    <button class="fleche" id="loupe-prec" aria-label="←">‹</button>
    <div id="loupe-bande"></div>
    <button class="fleche" id="loupe-suiv" aria-label="→">›</button>
    <a id="loupe-lien" target="_blank" rel="noopener"></a>
  </div>

  <footer>
    <span data-t="auteur" style="display:block; color:var(--encre-2); margin-bottom:6px"></span>
    <span data-t="piedPage"></span>
  </footer>
</div>

const LANGUES = { fr:'Français', en:'English', es:'Español', pt:'Português', it:'Italiano', de:'Deutsch' };

function langueInitiale() {
  try {
    const m = new URLSearchParams(location.search).get('lang');
    if (m && LANGUES[m]) return m;
    const g = localStorage.getItem('langue');
    if (g && LANGUES[g]) return g;
  } catch (e) { /* navigation privée : on retombe sur la langue du navigateur */ }
  const n = String(navigator.language || 'fr').slice(0, 2).toLowerCase();
  return LANGUES[n] ? n : 'fr';
}

let langue = langueInitiale();

/* Traduction. Les valeurs peuvent contenir des marqueurs {0}, {1}… remplacés par les
   arguments passés à l'appel. Une clé inconnue se renvoie elle-même, ce qui la rend visible
   à l'écran plutôt que de laisser un vide. */
const t = (cle, ...v) => {
  let x = (TEXTES[langue] && TEXTES[langue][cle]) || TEXTES.en[cle] || cle;
  v.forEach((val, i) => { x = x.replace('{' + i + '}', val); });
  return x;
};

/* Applique les traductions au document : texte pour data-t, invite de saisie pour data-tp,
   infobulle pour data-tt — ce dernier laissant le contenu de l'élément intact, ce qui permet
   de traduire un bouton réduit à une icône. */
function traduire() {
  document.documentElement.lang = langue;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t(el.dataset.t); if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-tp]').forEach(el => {
    const v = t(el.dataset.tp); if (v) el.placeholder = v;
  });
  document.querySelectorAll('[data-tt]').forEach(el => {
    const v = t(el.dataset.tt);
    if (v) { el.title = v; el.setAttribute('aria-label', v); }
  });
}

/* Changement de langue sans rechargement. Les textes du site basculent aussitôt ; seuls les
   noms vernaculaires viennent d'iNaturalist et doivent être redemandés — et uniquement si
   l'affichage les utilise. */
async function changerLangue(l) {
  if (!LANGUES[l] || l === langue) return;
  langue = l;
  try { localStorage.setItem('langue', l); } catch (e) { /* sans effet en navigation privée */ }

  MOIS = MOIS_L[l] || MOIS_L.en;
  MOIS_C = MOIS_C_L[l] || MOIS_C_L.en;
  traduire();
  majURL();

  // Les réponses en cache portent l'ancienne langue dans leur adresse : elles sont caduques.
  cache.clear();
  vocabulaire = null; vocabulairePour = null; cachePhotos.clear();

  if (!etat.especes.length) return;
  if (vue.nommage === 'sci') { redessinerTout(); return; }

}

/* Ne récupère que les noms vernaculaires, par lots de deux cents taxons : environ sept
   requêtes pour un inventaire de mille quatre cents espèces, contre une cinquantaine pour
   un rechargement complet. */
async function rafraichirNoms() {
  const gen = generation;
  const ids = [...new Set([...etat.especes.map(e => e.id), ...etat.ancetres.keys()])];
  const parId = new Map(etat.especes.map(e => [e.id, e]));

  try {
    for (let i = 0; i < ids.length; i += 200) {
      progression(t('mNoms', Math.min(i + 200, ids.length), ids.length),
        (i / ids.length) * 100);
      const d = await appel('/taxa', { id: ids.slice(i, i + 200).join(','),
        per_page:200, locale:langue });
      verifier(gen);
      (d.results || []).forEach(x => {
        const nom = x.preferred_common_name || '';
        const e = parId.get(x.id);
        if (e) e.nomFr = nom;
        const a = etat.ancetres.get(x.id);
        if (a) a.nomFr = nom;
      });
    }
    redessinerTout();
    enregistrer();
    progression(t('mComplet'), null);
  } catch (e) {
    if (!(e instanceof Annule)) progression(t('mEchec', String((e && e.message) || e)), null);
  }
}

const IUCN = {

  60:{ c:'EW', n:t('i_EW'), bg:'#542344', fg:'#FFFFFF' },

  20:{ c:'NT', n:t('i_NT'), bg:'#CCE226', fg:'#333A08' },
  10:{ c:'LC', n:t('i_LC'), bg:'#DCE9D4', fg:'#2F4A26' },
   5:{ c:'DD', n:t('i_DD'), bg:'#E4E4DC', fg:'#4A4A44' }
};
const CODE_IUCN = { ex:70, ew:60, cr:50, en:40, vu:30, nt:20, lc:10, dd:5 };

/* Paliers de lecture, une décade chacun : c'est le découpage naturel d'une part
   d'observations, où l'écart entre 0,1 % et 1 % compte autant que celui entre 10 % et 100 %. */
/* Six niveaux au lieu de quatre. Au-delà de 10 %, une même couleur couvrait une décade
   entière : une espèce dont la zone détient 12 % des signalements n'a pourtant rien à voir
   avec une espèce qu'on n'y trouve pratiquement que là. */
const PALIERS = [
  { min:60,  etiquette:'≥ 60 %',  nom:t('pExclusive'), couleur:'#3B1F2B' },
  { min:30,  etiquette:'≥ 30 %',  nom:t('pMajeure'), couleur:'#7B3B52' },
  { min:10,  etiquette:'≥ 10 %',  nom:t('pTresForte'), couleur:'#B4553A' },
  { min:1,   etiquette:'≥ 1 %',   nom:t('pForte'), couleur:'#C97E2B' },
  { min:0.1, etiquette:'≥ 0,1 %', nom:t('pNotable'), couleur:'#C6A73C' },
  { min:0,   etiquette:'< 0,1 %', nom:t('pFaible'), couleur:'#9BB39E' }
];
const palier = pct => PALIERS.find(p => pct >= p.min) || PALIERS[PALIERS.length - 1];

/* Longueur de barre logarithmique sur trois décades, de 0,1 % à 100 %. Les graduations
   tombent alors exactement sur les bornes de couleur : 0,1 % au tiers de départ, 1 % au
   tiers, 10 % aux deux tiers. Tout plancher est un choix arbitraire — celui-ci est le plus
   bas qui garde une lecture honnête, sans étirer les parts infimes. */
const PLANCHER = 0.1;
function largeurLog(pct) {
  if (pct <= 0) return 0;
  const l = ((Math.log10(pct) - Math.log10(PLANCHER)) / 3) * 100;
  return Math.max(1.5, Math.min(100, l));   // un filet reste visible sous le plancher
}

function pourcent(pct) {
  if (pct > 0 && pct < 0.001) return '< 0,001 %';
  const d = pct >= 10 ? 0 : pct >= 1 ? 1 : pct >= 0.1 ? 2 : 3;
  return pct.toLocaleString(langue, { maximumFractionDigits:d }) + ' %';
}

function pastilleIUCN(code) {
  if (!code || !IUCN[code]) return '<span class="iucn vide">—</span>';
  const s = IUCN[code];
  const alerte = code >= 30
    ? `<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.6 9.4 9H0.6z"
         fill="none" stroke="${s.fg}" stroke-width="1.3" stroke-linejoin="round"/></svg>`
    : `<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.4"
         fill="none" stroke="${s.fg}" stroke-width="1.3"/></svg>`;
  return `<span class="iucn" style="background:${s.bg};color:${s.fg}" title="${s.n}">${alerte}${s.c}</span>`;
}


/* ============================================================
   1 bis. Mémoire locale et adresse partageable
   ============================================================ */

/* IndexedDB garde les inventaires déjà consultés pendant une semaine. Revenir sur un lieu
   ne coûte alors plus une seule requête. La clé décrit exactement ce qui a été chargé :
   changer de lieu, de taxon ou de territoire de référence produit une autre entrée. */
/* ============================================================
   Accès à l'API iNaturalist
   ============================================================ */

const API = 'https://api.inaturalist.org/v1';
const API2 = 'https://api.inaturalist.org/v2';

const attente = ms => new Promise(r => setTimeout(r, ms));
const cache = new Map();

/* iNaturalist demande de rester sous 60 requêtes par minute, soit une par seconde. Le
   comptage porte sur le moment où les requêtes sont lancées, pas sur celui où elles
   aboutissent : espacer de 1000 ms exactement produit encore des 429, d'où la marge à 1050. */
const INTERVALLE = 1050;
let dernierDepart = 0;

async function attendreSonTour() {
  const restant = INTERVALLE - (Date.now() - dernierDepart);
  if (restant > 0) await attente(restant);
  dernierDepart = Date.now();
}

/* Deux files pour une seule cadence. Ce que l'utilisateur demande à l'instant — les photos
   d'une comparaison, un clic sur la carte — passe devant le chargement de fond, qui peut
   compter trente requêtes en attente. Le débit global ne change pas, seulement l'ordre. */
const attentes = { prio: [], fond: [] };
let tourne = false;

/* Arrêt immédiat : on rejette ce qui attendait son tour. Sans ce rejet, les fonctions en
   attente resteraient suspendues pour toujours. */
function viderFiles() {
  for (const f of ['prio', 'fond']) attentes[f].splice(0).forEach(i => i.ko(new Annule()));
}

function enFile(tache, prio = false) {
  return new Promise((ok, ko) => {
    attentes[prio ? 'prio' : 'fond'].push({ tache, ok, ko });
    boucler();
  });
}

async function boucler() {
  if (tourne) return;
  tourne = true;
  while (attentes.prio.length || attentes.fond.length) {
    const item = attentes.prio.shift() || attentes.fond.shift();
    await attendreSonTour();
    try { item.ok(await item.tache()); } catch (e) { item.ko(e); }
  }
  tourne = false;
}

/* La file de requêtes espace les appels, mais elle ne les ordonne pas par tâche : deux
   chargements lancés en parallèle voient leurs requêtes s'entrelacer. Cette seconde file
   sérialise les tâches — une phase va au bout avant que la suivante commence. */
let chaineTaches = Promise.resolve();

function enTache(fn) {
  const suivant = chaineTaches.then(() => fn());
  chaineTaches = suivant.catch(() => {});
  return suivant;
}

function urlDe(chemin, params, v2) {
  const u = new URL((v2 ? API2 : API) + chemin);
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, v);
  }
  return u.toString();
}

/* Trois tentatives : une coupure passagère ou un 429 ne doit pas condamner un chargement. */
async function recuperer(url, essais = 3) {
  for (let i = 1; i <= essais; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) return await r.json();
      if (r.status === 429 && i < essais) { await attente(3000 * i); continue; }
      throw new Error('HTTP ' + r.status);
    } catch (e) {
      if (i === essais) throw e;
      await attente(1200 * i);
    }
  }
}

function appel(chemin, params = {}, v2 = false, prio = false) {
  const cle = urlDe(chemin, params, v2);
  if (cache.has(cle)) return Promise.resolve(cache.get(cle));
  return enFile(async () => {
    if (cache.has(cle)) return cache.get(cle);
    const d = await recuperer(cle);
    cache.set(cle, d);
    return d;
  }, prio);
}

/* Certaines requêtes d'interface ne doivent pas attendre derrière l'inventaire : elles
   court-circuitent la file, mais pas la cadence. */
async function appelDirect(chemin, params = {}) {
  const cle = urlDe(chemin, params, false);
  if (cache.has(cle)) return cache.get(cle);
  await attendreSonTour();
  const d = await recuperer(cle, 2);
  cache.set(cle, d);
  return d;
}

const CHAMPS_COMPTE = '(count:!t,taxon:(id:!t))';

/* Champs demandés pour la liste des espèces : le strict nécessaire, ce qui divise le poids
   de la réponse par une dizaine par rapport à la v1 complète. */
const CHAMPS_ESPECE = '(count:!t,taxon:(id:!t,name:!t,rank:!t,preferred_common_name:!t,'
  + 'ancestor_ids:!t,conservation_status:(status_name:!t,status:!t),'
  + 'default_photo:(square_url:!t,medium_url:!t,url:!t,attribution:!t)))';

/* Noms des rangs taxonomiques, dans la langue choisie. Les clés préfixées r_ existent dans
   les traductions ; on retombe sur le terme latin pour tout rang non prévu. */
const NOM_RANG = new Proxy({}, {
  get: (_, k) => {
    if (typeof k !== 'string') return '';
    const v = t('r_' + k);
    return v === 'r_' + k ? k : v;
  }
});

/* La v2 allège fortement les réponses, mais toutes les instances ne la servent pas de la
   même façon : on la teste une fois, puis on s'y tient. */
let apiV2 = null, especesV2 = null, moisV2 = null;

async function testerV2() {
  if (apiV2 !== null) return apiV2;
  try {
    const d = await appel('/observations/species_counts',
      { per_page:1, fields:CHAMPS_COMPTE }, true);
    apiV2 = !!(d && d.results);
  } catch (e) { apiV2 = false; }
  console.info('API v2 :', apiV2 ? 'active' : 'indisponible, repli sur la v1');
  return apiV2;
}

async function comptages(f, forcerV1 = false, champs = CHAMPS_COMPTE) {
  if (!forcerV1 && await testerV2()) {
    try {
      return await appel('/observations/species_counts', { ...f, fields:champs }, true);
    } catch (e) { /* on retombe sur la v1 */ }
  }
  return appel('/observations/species_counts', f);
}

/* Un paramètre inconnu n'est pas rejeté : il est ignoré, la requête réussit et renvoie des
   données non filtrées. On vérifie donc que les filtres temporels agissent réellement. */
async function testerMoisV2(f) {
  if (moisV2 !== null) return moisV2;
  if (!await testerV2()) { moisV2 = false; return false; }
  try {
    const opts = { per_page:1, fields:CHAMPS_COMPTE };
    const q = p => appel('/observations/species_counts', { ...f, ...p, ...opts }, true);
    const an = await q({});
    const jan = await q({ month:1 });
    const jui = await q({ month:7 });
    const recent = await q({ d1: jour(ilYa(3)) });
    const ancien = await q({ d2: jour(ilYa(120)) });
    const total = an.total_results;
    moisV2 = !!(total && jan.total_results !== total && jui.total_results !== total
      && recent.total_results !== total && ancien.total_results !== total);
  } catch (e) { moisV2 = false; }
  console.info('Filtres temporels en v2 :', moisV2 ? 'actifs' : 'ignorés, repli sur la v1');
  return moisV2;
}

const BASE = 'inventaire-inat';
/* À incrémenter dès qu'un calcul enregistré change de sens : sans cela, un inventaire mis en
   mémoire ressortirait avec les résultats de l'ancienne version, sans que rien ne le signale. */
const VERSION_DONNEES = 3;
const PEREMPTION = 7 * 24 * 3600 * 1000;

/* IndexedDB peut rester muette : en navigation privée sur iOS, ou quand un autre onglet
   retient la base, l'ouverture ne déclenche ni succès ni erreur. Sans délai de garde, le
   chargement attend indéfiniment et le bouton reste grisé sans aucun message. */
function avecDelai(promesse, ms = 2500) {
  return Promise.race([
    promesse,
    new Promise(r => setTimeout(() => r(null), ms))
  ]);
}

function ouvrirBase() {
  return new Promise((ok, ko) => {
    if (typeof indexedDB === 'undefined' || !indexedDB) return ko(new Error('indisponible'));
    const r = indexedDB.open(BASE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('inventaires', { keyPath:'cle' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
    r.onblocked = () => ko(new Error('bloquée par un autre onglet'));
  });
}

async function surBase(mode, action) {
  try {
    const db = await avecDelai(ouvrirBase());
    if (!db) { console.warn('Mémoire locale indisponible : on continue sans cache.'); return null; }
    return await avecDelai(new Promise((ok, ko) => {
      const t = db.transaction('inventaires', mode);
      const req = action(t.objectStore('inventaires'));
      req.onsuccess = () => ok(req.result);
      req.onerror = () => ko(req.error);
    }));
  } catch (e) { return null; }   // navigation privée, quota plein : on continue sans cache
}

function cleInventaire() {
  return [
    etat.lieux.map(l => l.id).sort((a, b) => a - b).join('.'),
    etat.taxons.map(t => t.id).sort((a, b) => a - b).join('.'),
    etat.zone ? Object.values(etat.zone).join(',') : '',
    etat.reference ? etat.reference.id : 'monde',
    langue, VERSION_DONNEES
  ].join('|');
}

function enregistrer() {
  if (!etat.especes.length) return;
  surBase('readwrite', st => st.put({
    cle: cleInventaire(), date: Date.now(),
    // De quoi rejouer la sélection telle quelle depuis le panneau de mémoire.
    lieux: etat.lieux, taxons: etat.taxons, zone: etat.zone, reference: etat.reference,
    especes: etat.especes, ancetres: [...etat.ancetres],
    seriesCache: etat.seriesCache, tronque: etat.tronque, decouvertes, disparitions,
    decMois, disMois,          // la fenêtre retenue fait partie du résultat
    panier: etat.panier,
    phenoCache: {
      research: etat.phenoCache.research ? [...etat.phenoCache.research] : null,
      toutes:   etat.phenoCache.toutes   ? [...etat.phenoCache.toutes]   : null
    }
  }));
}

async function restaurer(gen) {
  const d = await surBase('readonly', st => st.get(cleInventaire()));
  if (!d || Date.now() - d.date > PEREMPTION) return false;
  verifier(gen);

  etat.especes = d.especes;
  etat.ancetres = new Map(d.ancetres);
  etat.seriesCache = d.seriesCache || { research:{}, toutes:{} };
  etat.annees = (etat.seriesCache[etat.qualite] || {}).annees || null;
  etat.mensuel = (etat.seriesCache[etat.qualite] || {}).mensuel || null;
  etat.tronque = d.tronque;
  etat.panier = d.panier || [];
  decouvertes = d.decouvertes || null;
  disparitions = d.disparitions || null;
  if (d.decMois) decMois = d.decMois;
  if (d.disMois) disMois = d.disMois;
  const pc = d.phenoCache || {};
  etat.phenoCache = {
    research: pc.research ? new Map(pc.research) : null,
    toutes:   pc.toutes   ? new Map(pc.toutes)   : null
  };
  etat.phenologie = etat.phenoCache[etat.qualite];

  appliquerQualite();
  construireArbre();
  dessinerListe();
  dessinerResponsabilite();
  dessinerSaison();
  dessinerDecouvertes();
  dessinerDisparitions();
  if (carte) { majCarte(); cadrerSurLieux(); }

  const jours = Math.floor((Date.now() - d.date) / 86400000);
  progression(t('mMemoire', nb(etat.especes.length), jours ? t('mJours', jours) : t('mAujourdhui')), null);
  return true;
}

/* Remise à zéro complète : les inventaires enregistrés, le cache des requêtes de la session,
   la sélection en cours et l'adresse. Autrement, vider la base laissait en place des données
   déjà chargées en mémoire et le site paraissait ne pas avoir bougé. */
/* Panneau de la mémoire : ce qui est enregistré, et de quoi le rouvrir d'un clic. Les
   inventaires d'avant cette version n'ont pas gardé leur sélection ; ils sont listés mais
   seulement effaçables, faute de savoir ce qu'ils décrivent. */
/* Les enregistrements d'avant le stockage de la sélection ne gardent que la clé, qui contient
   les identifiants. On les traduit en noms : une requête pour tous les lieux, une pour tous
   les groupes, quel que soit le nombre d'inventaires listés. */
async function nommerDepuisCle(liste) {
  const aNommer = liste.filter(d => !d.lieux && typeof d.cle === 'string');
  if (!aNommer.length) return;

  const lieux = new Set(), taxons = new Set();
  for (const d of aNommer) {
    const p = d.cle.split('|');
    (p[0] || '').split('.').filter(Boolean).forEach(x => lieux.add(x));
    (p[1] || '').split('.').filter(Boolean).forEach(x => taxons.add(x));
  }

  const noms = new Map();
  const recuperer = async (chemin, ids) => {
    if (!ids.size) return;
    try {
      const d = await appelDirect(chemin + [...ids].join(','), { locale:langue });
      (d.results || []).forEach(x => noms.set(String(x.id),
        x.display_name || x.preferred_common_name || x.name));
    } catch (e) { /* sans nom, la ligne reste ouvrable par ses identifiants */ }
  };
  await recuperer('/places/', lieux);
  await recuperer('/taxa/', taxons);

  for (const d of aNommer) {
    // lieux | groupes | zone | référence | langue | version
    const p = d.cle.split('|');
    const monter = (bruts) => bruts.split('.').filter(Boolean)
      .map(id => ({ id:+id, nom: noms.get(id) || '#' + id }));
    d.lieux = monter(p[0] || '');
    d.taxons = monter(p[1] || '');
    if (p[2]) {
      const c = p[2].split(',').map(Number);
      if (c.length === 4 && c.every(isFinite))
        d.zone = { swlat:c[0], swlng:c[1], nelat:c[2], nelng:c[3] };
    }
    d.reference = (p[3] && p[3] !== 'monde')
      ? { id:+p[3], nom: noms.get(p[3]) || '#' + p[3] } : null;
  }
}

/* Coordonnées lisibles d'un rectangle : deux intervalles, avec les points cardinaux. */
function coinsZone(z) {
  const deg = (v, pos, neg) => Math.abs(v).toFixed(2).replace('.', ',') + ' ' + (v >= 0 ? pos : neg);
  return `${deg(z.swlat, 'N', 'S')}–${deg(z.nelat, 'N', 'S')} · ${deg(z.swlng, 'E', 'O')}–${deg(z.nelng, 'E', 'O')}`;
}

async function listerMemoire() {
  const boite = $('#memoire'), cible = $('#memoire-liste');
  if (!boite || !cible) return;
  boite.hidden = !boite.hidden;
  if (boite.hidden) return;

  cible.innerHTML = `<div class="etat">…</div>`;
  const tout = await surBase('readonly', st => st.getAll());
  const liste = (tout || []).sort((a, b) => b.date - a.date);
  if (!liste.length) { cible.innerHTML = `<div class="etat">${t('memVide')}</div>`; return; }
  await nommerDepuisCle(liste);

  cible.innerHTML = liste.map((d, i) => {
    const noms = [...(d.lieux || []).map(l => l.nom), ...(d.taxons || []).map(x => x.nom)];
    if (d.zone) noms.push(t('zoneTracee') + ' ' + coinsZone(d.zone));
    const jours = Math.floor((Date.now() - d.date) / 86400000);
    return `<div class="ligne">
      <div class="quoi">
        <b>${noms.length ? echap(noms.join(' · ')) : t('memAncien')}</b>
        <div class="quand">${nb((d.especes || []).length)} ${t('especes')} · ${
          jours ? t('mJours', jours) : t('mAujourdhui')}</div>
      </div>
      <div style="flex:none">
        ${(noms.length || d.zone) ? `<button class="discret" data-ouvrir="${i}"
          >${t('memOuvrir')}</button>` : ''}
        <button class="discret" data-oublier="${i}">${t('memOublier')}</button>
      </div>
    </div>`;
  }).join('');

  cible.querySelectorAll('[data-ouvrir]').forEach(b => b.addEventListener('click', () => {
    const d = liste[+b.dataset.ouvrir];
    etat.lieux = d.lieux || []; etat.taxons = d.taxons || [];
    etat.zone = d.zone || null; etat.reference = d.reference || null;
    $('#r-ref').value = etat.reference ? etat.reference.nom : '';
    majBoutonRef();
    dessinerJetons();
    boite.hidden = true;
    majURL();
    charger();
  }));

  cible.querySelectorAll('[data-oublier]').forEach(b => b.addEventListener('click', async () => {
    const d = liste[+b.dataset.oublier];
    await surBase('readwrite', st => st.delete(d.cle));
    boite.hidden = true;
    listerMemoire();
  }));
}

/* L'adresse reflète l'inventaire affiché, ce qui la rend partageable et permet de revenir
   en arrière. Les lieux et taxons n'y figurent que par leur identifiant ; leurs noms sont
   récupérés au chargement de la page. */
function majURL(nouvelleEntree = false) {
  const p = new URLSearchParams();
  if (etat.lieux.length) p.set('lieux', etat.lieux.map(l => l.id).join(','));
  if (etat.taxons.length) p.set('taxons', etat.taxons.map(t => t.id).join(','));
  if (etat.zone) p.set('zone', Object.values(etat.zone).join(','));
  if (etat.reference) p.set('ref', etat.reference.id);
  if (etat.qualite !== 'research') p.set('validation', etat.qualite);
  if (vue.nommage !== 'sci') p.set('noms', vue.nommage);
  const onglet = document.querySelector('nav.onglets button.actif');
  if (onglet && onglet.dataset.vue !== 'liste') p.set('onglet', onglet.dataset.vue);
  const url = location.pathname + (p.toString() ? '?' + p : '');
  if (nouvelleEntree) history.pushState({}, '', url); else history.replaceState({}, '', url);
}

async function lireURL() {
  const p = new URLSearchParams(location.search);
  if (p.get('validation')) { etat.qualite = p.get('validation'); $('#f-qualite').value = etat.qualite; }
  if (p.get('noms')) { vue.nommage = p.get('noms'); $('#f-nommage').value = vue.nommage; }

  const onglet = p.get('onglet');
  if (onglet) {
    const b = document.querySelector(`nav.onglets button[data-vue="${onglet}"]`);
    if (b) b.click();
  }

  const z = (p.get('zone') || '').split(',').map(Number).filter(n => isFinite(n));
  if (z.length === 4) etat.zone = { swlat:z[0], swlng:z[1], nelat:z[2], nelng:z[3] };
  const lieux = (p.get('lieux') || '').split(',').filter(Boolean);
  const taxons = (p.get('taxons') || '').split(',').filter(Boolean);
  const ref = p.get('ref');
  if (!lieux.length && !taxons.length && !etat.zone) return;

  try {
    for (const id of lieux) {
      const d = await appelDirect('/places/' + id, {});
      const x = d.results && d.results[0];
      if (x) etat.lieux.push({ id:x.id, nom:x.display_name || x.name,
        bbox:x.bounding_box_geojson || null, loc:x.location || null, aire:x.bbox_area || null });
    }
    if (taxons.length) {
      const d = await appelDirect('/taxa/' + taxons.join(','), { locale:langue });
      (d.results || []).forEach(t => etat.taxons.push({ id:t.id, nom:t.preferred_common_name || t.name }));
    }
    if (ref) {
      const d = await appelDirect('/places/' + ref, {});
      const x = d.results && d.results[0];
      if (x) { etat.reference = { id:x.id, nom:x.display_name || x.name };
        $('#r-ref').value = etat.reference.nom; majBoutonRef(); }
    }
  } catch (e) { /* lien incomplet : on laisse l'utilisateur compléter à la main */ }

  dessinerJetons();
  if (etat.lieux.length || etat.taxons.length || etat.zone) charger();
}

/* Un même taxon a deux noms possibles. On choisit lequel porte l'information principale,
   l'autre passe en second, et la mise en forme suit : le latin reste toujours en italique. */
function libelles(sci, fr) {
  return vue.nommage === 'sci'
    ? { principal:sci, secondaire:fr || '', latinDevant:true }
    : { principal:fr || sci, secondaire:fr ? sci : '', latinDevant:!fr };
}

function blocNoms(sci, fr) {
  const l = libelles(sci, fr);
  return `<div class="fr${l.latinDevant ? ' lat' : ''}">${echap(l.principal)}</div>` +
    (l.secondaire ? `<div class="sci${l.latinDevant ? ' romain' : ''}">${echap(l.secondaire)}</div>` : '');
}

function nomCourt(sci, fr) { return libelles(sci, fr).principal; }

/* Le lien renvoie vers les observations de l'espèce dans la zone, pas vers la fiche mondiale
   du taxon : on reporte donc les lieux, le niveau de validation et, s'il est actif, le mois. */
/* Fiche du taxon sur iNaturalist. Avec un lieu, la page s'ouvre sur ce territoire :
   statut, saisonnalité et carte s'y rapportent alors, au lieu du monde entier. */
function lienTaxon(id, avecLieu) {
  const base = 'https://www.inaturalist.org/taxa/' + id;
  return (avecLieu && etat.lieux.length) ? base + '?place_id=' + etat.lieux[0].id : base;
}

/* Les observations d'une espèce, soit dans la zone d'étude, soit dans le territoire de
   référence — exactement le périmètre des deux colonnes chiffrées. Les filtres transmis sont
   ceux du site, ce qui permet de vérifier d'un clic d'où sort un effectif surprenant. */
function lienPortee(id, portee) {
  const p = new URLSearchParams({ taxon_id:id, captive:'false', verifiable:'true' });
  if (etat.qualite === 'research') p.set('quality_grade', 'research');
  if (portee === 'zone') {
    if (etat.lieux.length) p.set('place_id', etat.lieux.map(l => l.id).join(','));
    if (etat.zone) for (const [k, v] of Object.entries(etat.zone)) p.set(k, v);
  } else if (etat.reference) {
    p.set('place_id', etat.reference.id);
  }
  return 'https://www.inaturalist.org/observations?' + p.toString();
}

function lienINat(id, mois, vue) {
  const p = new URLSearchParams({ taxon_id:id, captive:'false', verifiable:'true' });
  if (vue) p.set('view', vue);
  if (etat.lieux.length) p.set('place_id', etat.lieux.map(l => l.id).join(','));
  if (etat.zone) for (const [k, v] of Object.entries(etat.zone)) p.set(k, v);
  if (etat.qualite === 'research') p.set('quality_grade', 'research');
  if (mois) p.set('month', mois);
  return 'https://www.inaturalist.org/observations?' + p.toString();
}

/* Un chargement plus récent invalide les précédents : chaque étape vérifie qu'elle
   appartient encore à la génération courante avant d'écrire dans l'état. */
let generation = 0;
class Annule extends Error {}
function verifier(gen) { if (gen !== generation) throw new Annule(); }

const $ = s => document.querySelector(s);
const nb = n => n.toLocaleString(langue);
const echap = s => String(s || '').replace(/[<>"]/g, '');

/* Le filtre de validation s'applique partout : liste, carte, responsabilité, statistiques. */
function filtres(avecLieu = true, qualite = etat.qualite) {
  /* Dans les deux modes, on écarte les individus cultivés ou captifs et les observations
     non vérifiables — sans photo ni son, elles ne peuvent être confirmées par personne. */
  const f = { captive:'false', verifiable:'true', locale:langue };
  if (qualite === 'research') f.quality_grade = 'research';
  if (avecLieu && etat.lieux.length) f.place_id = etat.lieux.map(l => l.id).join(',');
  // Une zone dessinée remplace le lieu : tous les endroits utilisés acceptent une boîte.
  if (avecLieu && etat.zone) Object.assign(f, etat.zone);
  // Sans lieu d'étude, on interroge le territoire de référence — le monde s'il n'y en a pas.
  if (!avecLieu && etat.reference) f.place_id = etat.reference.id;
  if (etat.taxons.length) f.taxon_id = etat.taxons.map(t => t.id).join(',');
  return f;
}

}

/* garderTexte : pour la référence, le champ affiche le territoire retenu au lieu d'être
   vidé — le choix n'y devient pas un jeton, c'est le texte lui-même qui porte l'information. */
function autocompletion(idChamp, idListe, chemin, versObjet, onChoix, garderTexte) {
  const champ = $(idChamp), liste = $(idListe);
  let minuteur = null, resultats = [], vise = -1;
  const fermer = () => { liste.classList.remove('on'); vise = -1; };

  champ.addEventListener('input', () => {
    clearTimeout(minuteur);
    const q = champ.value.trim();
    if (q.length < 2) return fermer();
    minuteur = setTimeout(async () => {
      try {
        const d = await appel(chemin, { q, per_page:8, locale:langue });
        resultats = d.results.map(versObjet);
        if (!resultats.length) return fermer();
        liste.innerHTML = resultats.map((r, i) =>
          `<div class="prop" data-i="${i}">${echap(r.nom)}<small>${echap(r.detail)}</small></div>`).join('');
        liste.classList.add('on');
      } catch (e) { fermer(); }
    }, 300);
  });

  champ.addEventListener('keydown', e => {
    const props = [...liste.querySelectorAll('.prop')];
    if (!props.length || !liste.classList.contains('on')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      vise = (vise + (e.key === 'ArrowDown' ? 1 : -1) + props.length) % props.length;
      props.forEach((p, i) => p.classList.toggle('vise', i === vise));
    } else if (e.key === 'Enter' && vise >= 0) { e.preventDefault(); choisir(vise); }
    else if (e.key === 'Escape') fermer();
  });

  liste.addEventListener('click', e => {
    const p = e.target.closest('.prop'); if (p) choisir(+p.dataset.i);
  });
  document.addEventListener('click', e => {
    if (!champ.contains(e.target) && !liste.contains(e.target)) fermer();
  });
  function choisir(i) {
    onChoix(resultats[i]);
    if (!garderTexte) champ.value = '';
    fermer();
  }
}

});
