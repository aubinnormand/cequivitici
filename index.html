/* Le libellé traduit se trouve selon les cas dans le champ label, ou dans un tableau labels
   contenant une entrée par langue. On prend la traduction quand elle existe. */
function libelleTerme(x) {
  const l = (x.labels || []).find(y => y.locale === langue || String(y.locale).startsWith(langue));
  const brut = (l && (l.label || l.value_label)) || x.label || '';
  const trad = ANNOTATIONS[String(brut).toLowerCase()];
  return (trad && trad[langue]) || brut;
}

/* Trois niveaux, du plus précis au plus sûr. L'endpoint par taxon d'abord ; sinon le
   vocabulaire général filtré localement sur les clades d'application, que chaque terme
   déclare dans taxon_ids ; et à défaut le vocabulaire entier. Sans ce filtrage, on proposait
   « plume » ou « œuf » sur des plantes. */
function termesUtilisables(liste, e) {
  const lignee = new Set([e.id, ...(e.anc || [])]);
  const filtres = liste.filter(x => {
    const inclus = x.taxon_ids || x.valid_within_taxon_ids;
    const exclus = x.excepted_taxon_ids || [];
    if (exclus.some(id => lignee.has(id))) return false;
    return !inclus || !inclus.length || inclus.some(id => lignee.has(id));
  });
  return filtres.length ? filtres : liste;
}

/* Ordre d'affichage des termes : ce qui distingue le plus deux individus d'abord. Le sexe,
   souvent responsable de plumages ou de livrées entièrement différents ; puis le stade, qui
   change tout autant l'aspect — chenille contre papillon, plante en fleur contre en feuilles.
   Le reste suit dans l'ordre renvoyé par l'API. */
/* Les fleurs et fruits passent devant : chez une plante, ce sont eux qui changent l'aspect,
   et les termes propres aux animaux ne lui sont de toute façon pas proposés. */
const ORDRE_TERMES = ['flowers and fruits', 'plant phenology', 'leaves', 'sex', 'life stage'];

function rangTerme(x) {
  const i = ORDRE_TERMES.indexOf(String(x.label || '').toLowerCase());
  return i < 0 ? ORDRE_TERMES.length : i;
}

async function chargerVocabulaire(e) {
  const taxon = e && e.id;
  if (vocabulaire && vocabulairePour === taxon) return vocabulaire;
  vocabulairePour = taxon;

  const utilisable = d => (d && d.results || [])
    .map(x => x.values ? x : (x.controlled_attribute || null))
    .filter(x => x && x.values && x.values.length);

  try {
    if (taxon) {
      const d = await appel('/controlled_terms/for_taxon', { taxon_id:taxon, locale:langue });
      const v = utilisable(d);
      if (v.length) { vocabulaire = trierTermes(v); return vocabulaire; }
      console.info('Annotations : réponse par taxon inexploitable, filtrage local', d);
    }
    const g = await appel('/controlled_terms', { locale:langue });
    vocabulaire = e ? termesUtilisables(utilisable(g), e) : utilisable(g);
  } catch (err) { vocabulaire = []; }
  vocabulaire = trierTermes(vocabulaire);
  return vocabulaire;
}

function trierTermes(liste) {
  return [...liste].sort((a, b) => rangTerme(a) - rangTerme(b));
}

async function photosEspece(id) {
  const cle = [id, cpAnnot, cpLocal, etat.qualite].join('|');
  if (cachePhotos.has(cle)) return cachePhotos.get(cle);

  /* Toujours en qualité recherche : une photo mal déterminée n'aide pas à comparer.
     On ne desserre que si la sélection est trop pauvre pour donner trois images. */
  const p = { taxon_id:id, photos:'true', captive:'false', verifiable:'true',
              quality_grade:'research', order_by:'observed_on', order:'desc',
              per_page:5, locale:langue };
  // Diagnostic : combien de photos par observation reviennent réellement ?
  if (cpLocal) {
    if (etat.lieux.length) p.place_id = etat.lieux.map(l => l.id).join(',');
    if (etat.zone) Object.assign(p, etat.zone);
  }
  if (cpAnnot) {
    const [terme, valeur] = cpAnnot.split(':');
    p.term_id = terme; p.term_value_id = valeur;
  }

  let res = [];
  const chercher = async p2 => {
    /* En v1 exclusivement : la sélection de champs de la v2 ne garantit pas de recevoir
       toutes les photos d'une observation, or c'est précisément ce qui permet de la
       feuilleter. Cinq observations pèsent peu, et l'appel est prioritaire. */
    const d = await appel('/observations', p2, false, true);
    /* Une entrée par observation, donc par individu, avec toutes ses photos : la comparaison
       porte sur cinq individus distincts, et chacun se feuillette latéralement si son auteur
       l'a photographié sous plusieurs angles. */
    return (d.results || []).map(o => {
      const urls = (o.photos || [])
        .map(ph => ph.medium_url || String(ph.url || '').replace('/square.', '/medium.'))
        .filter(Boolean);
      if (!urls.length) return null;
      const ph = o.photos[0];
      return { obs:o.id, urls, credit:(ph && ph.attribution) || '' };
    }).filter(Boolean);
  };

  try {
    res = await chercher(p);
    // Sans photo validée, on desserre : mieux vaut une image à confirmer que rien du tout.
    if (!res.length) {
      const large = { ...p };
      delete large.quality_grade;
      res = await chercher(large);
    }
  } catch (e) { res = []; }

  console.info('Photos de ' + id + ' :', res.map(o => o.urls.length).join(', ') || 'aucune');
  cachePhotos.set(cle, res);
  return res;
}

/* Calendrier d'une espèce. Si l'analyse mensuelle de l'onglet Saisonnalité a déjà tourné,
   la réponse est en mémoire ; sinon un histogramme suffit, en file prioritaire. */
async function phenoEspece(id) {
  if (etat.phenologie && etat.phenologie.has(id)) return etat.phenologie.get(id);
  const cle = 'pheno:' + id + ':' + etat.qualite + ':' + (cpLocal ? 'zone' : 'monde');
  if (cachePhotos.has(cle)) return cachePhotos.get(cle);
  let v = null;
  try {
    const base = cpLocal ? filtres() : { captive:'false', verifiable:'true', locale:langue };
    if (!cpLocal && etat.qualite === 'research') base.quality_grade = 'research';
    const d = await appel('/observations/histogram',
      { ...base, taxon_id:id, date_field:'observed', interval:'month_of_year' }, false, true);
    const r = (d.results && d.results.month_of_year) || {};
    v = Array.from({ length:12 }, (_, m) => r[m + 1] || r[String(m + 1)] || 0);
  } catch (e) { v = null; }
  cachePhotos.set(cle, v);
  return v;
}

function graphePheno(vals) {
  if (!vals || !vals.some(x => x)) return '';
  const max = Math.max(...vals), courant = new Date().getMonth();
  const l = 100 / 12;
  return `<svg viewBox="0 0 100 26" width="100%" height="26" role="img"
      aria-label="${echap(t('grapheMois'))}">${vals.map((v, i) => {
    const h = (v / max) * 22;
    return `<rect x="${(i * l + l * 0.15).toFixed(2)}" y="${(24 - h).toFixed(2)}"
      width="${(l * 0.7).toFixed(2)}" height="${Math.max(h, 0.6).toFixed(2)}"
      fill="${i === courant ? '#A87C14' : '#9BB39E'}" rx="0.6"
      ><title>${MOIS[i]} · ${nb(v)}</title></rect>`;
  }).join('')}</svg>`;
}

async function dessinerComparaison() {
  const v = $('#v-comparaison');
  if (!v) return;
  const parId = new Map(etat.especes.map(e => [e.id, e]));
  const choix = etat.panier.map(id => parId.get(id)).filter(Boolean);

  if (!choix.length) {
    v.innerHTML = `<div class="vide"><strong>${t('oComparaison')}</strong>${t('videComparaison')}</div>`;
    return;
  }

  // Le vocabulaire suit la première espèce retenue : comparer une plante et un insecte
  // n'a pas de sens, et le menu resterait de toute façon inutilisable dans ce cas.
  const voc = await chargerVocabulaire(choix[0]);
  const options = voc.map(terme =>
    `<optgroup label="${echap(libelleTerme(terme))}">${terme.values.map(val =>
      `<option value="${terme.id}:${val.id}"${cpAnnot === terme.id + ':' + val.id ? ' selected' : ''}
        >${echap(libelleTerme(val))}</option>`).join('')}</optgroup>`).join('');

  v.innerHTML = `
    <div class="outils">
      <select id="cp-annot">
        <option value=""${cpAnnot ? '' : ' selected'}>${t('cpToutes')}</option>${options}
      </select>
      <label class="bascule"><input type="checkbox" id="cp-local"${cpLocal ? ' checked' : ''}>
        <span>${t('cpLocal')}</span></label>
      <button class="discret" id="cp-vider">${t('cpVider')}</button>
      <span class="compte">${nb(choix.length)} ${t('especes')}</span>
    </div>
    <div id="cp-defil"><div></div></div>
    <div class="colonnes" style="grid-auto-columns:minmax(210px,${
      choix.length <= 2 ? 460 : choix.length === 3 ? 380 : 290}px)">${choix.map((e, i) => `
      <div class="colonne" data-esp="${e.id}">
        <div class="entete">
          <div>
            <a href="${lienTaxon(e.id, true)}" target="_blank" rel="noopener"
               style="text-decoration:none">${blocNoms(e.nom, e.nomFr)}</a>
            <div class="freq">${nb(e.nZone)} ${t('obs')}</div>
          </div>
          <div class="actions">
            <button class="plus" data-bouger="${i}:-1" aria-label="${echap(t('cpGauche'))}"
              ${i === 0 ? 'disabled' : ''}>‹</button>
            <button class="plus" data-bouger="${i}:1" aria-label="${echap(t('cpDroite'))}"
              ${i === choix.length - 1 ? 'disabled' : ''}>›</button>
            <button class="plus" data-retirer="${e.id}" aria-label="${echap(t('cpRetirer'))}">×</button>
          </div>
        </div>
        <div class="pheno" id="ph-${e.id}"></div>
        <div class="photos" id="cp-${e.id}"></div>
      </div>`).join('')}</div>
    <p class="note">${t('cpNote')}</p>`;

  /* Les deux barres se suivent l'une l'autre, et le fantôme prend la largeur réelle. */
  const defil = $('#cp-defil'), colonnes = v.querySelector('.colonnes');
  if (defil && colonnes) {
    defil.firstElementChild.style.width = colonnes.scrollWidth + 'px';
    let verrou = false;
    const lier = (a, b) => a.addEventListener('scroll', () => {
      if (verrou) return; verrou = true; b.scrollLeft = a.scrollLeft; verrou = false;
    });
    lier(defil, colonnes); lier(colonnes, defil);
  }

  $('#cp-annot').addEventListener('change', e => { cpAnnot = e.target.value; dessinerComparaison(); });
  $('#cp-local').addEventListener('change', e => { cpLocal = e.target.checked; dessinerComparaison(); });
  $('#cp-vider').addEventListener('click', () => { etat.panier = []; dessinerComparaison(); dessinerListe(); });
  v.querySelectorAll('[data-retirer]').forEach(b => b.addEventListener('click', () => {
    etat.panier = etat.panier.filter(x => x !== +b.dataset.retirer);
    dessinerComparaison(); dessinerListe();
  }));
  v.querySelectorAll('[data-bouger]').forEach(b => b.addEventListener('click', () => {
    const [i, sens] = b.dataset.bouger.split(':').map(Number);
    const j = i + sens;
    if (j < 0 || j >= etat.panier.length) return;
    [etat.panier[i], etat.panier[j]] = [etat.panier[j], etat.panier[i]];
    dessinerComparaison();
  }));

  // Les colonnes se remplissent l'une après l'autre, sans bloquer l'affichage.
  for (const e of choix) {
    const calendrier = await phenoEspece(e.id);
    const bloc = $('#ph-' + e.id);
    if (bloc) bloc.innerHTML = graphePheno(calendrier);
    const photos = await photosEspece(e.id);
    const cible = $('#cp-' + e.id);
    if (!cible) return;                 // la vue a changé entre-temps
    cible.innerHTML = photos.length
      ? photos.map(o => `<div class="obs">
          <div class="defile">${o.urls.map(u =>
            `<img src="${u}" loading="lazy" alt="" data-loupe="${u}" data-obs="${o.obs}">`).join('')}</div>
          ${o.urls.length > 1
            ? `<span class="pages">${o.urls.map((_, i) =>
                `<i${i ? '' : ' class="on"'}></i>`).join('')}</span>` : ''}
          <span class="credit">${echap(o.credit)}</span>
        </div>`).join('')
      : `<div class="vide" style="padding:18px">${t('cpAucune')}</div>`;
    cible.querySelectorAll('.obs').forEach((bloc, k) => {
      const o = photos[k];
      if (!o) return;
      bloc.querySelectorAll('.defile img').forEach((img, i) =>
        img.addEventListener('click', () => ouvrirLoupe(o.urls, i, o.obs)));
    });

    // Les points suivent la photo affichée pendant le défilement.
    cible.querySelectorAll('.obs').forEach(o => {
      const bande = o.querySelector('.defile');
      const points = o.querySelectorAll('.pages i');
      if (!bande || points.length < 2) return;
      bande.addEventListener('scroll', () => {
        const i = Math.round(bande.scrollLeft / bande.clientWidth);
        points.forEach((p, j) => p.classList.toggle('on', j === i));
      });
    });
  }
}

/* Agrandissement par-dessus la page. La loupe reçoit toute la série de l'observation : les
   vignettes sont trop petites pour qu'on y feuillette confortablement, et le clic ouvre de
   toute façon l'agrandissement. Flèches, glissement et touches du clavier y fonctionnent. */
function ouvrirLoupe(urls, index, obs) {
  const l = $('#loupe'), bande = $('#loupe-bande');
  bande.innerHTML = urls.map(u =>
    `<img src="${String(u).replace('/medium.', '/large.')}" alt="">`).join('');

  const lien = $('#loupe-lien');
  lien.href = 'https://www.inaturalist.org/observations/' + obs;
  lien.textContent = t('cpVoir');

  const seule = urls.length < 2;
  $('#loupe-prec').hidden = seule;
  $('#loupe-suiv').hidden = seule;
  l.hidden = false;
  // La largeur n'est connue qu'une fois la loupe affichée.
  requestAnimationFrame(() => { bande.scrollLeft = index * bande.clientWidth; });
}

function loupeDefiler(sens) {
  const bande = $('#loupe-bande');
  if (bande) bande.scrollBy({ left: sens * bande.clientWidth, behavior:'smooth' });
}


/* ============================================================
   Choisir un lieu sur une carte
   ============================================================ */

/* Plutôt que de laisser dessiner une zone libre — ce qui obligerait à remplacer place_id par
   une boîte géographique dans toutes les requêtes du site —, on interroge les lieux
   qu'iNaturalist connaît déjà sur l'emprise affichée. L'utilisateur reconnaît son massif ou
   sa commune, et le reste de l'application ne change pas d'un iota. */
let carteLieu = null, minuteurLieux = null, coucheChoix = null;

function ouvrirSelecteur() {
  const panneau = $('#selecteur');
  panneau.hidden = false;
  if (!carteLieu) {
    const b = bornesLocales();
    carteLieu = L.map('carte-lieu', { scrollWheelZoom:true });
    if (b) carteLieu.fitBounds(b, { padding:[16, 16], maxZoom:11 });
    else carteLieu.setView([46.6, 2.5], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap', maxZoom:19, className:'fond-clair'
    }).addTo(carteLieu);
    carteLieu.on('moveend', () => {
      clearTimeout(minuteurLieux);
      minuteurLieux = setTimeout(chercherLieux, 400);   // on attend l'arrêt du geste
    });
  }
  setTimeout(() => { carteLieu.invalidateSize(); chercherLieux(); tracerChoix(); }, 30);
}

/* Contours des lieux déjà retenus, dessinés sur la carte de sélection. Les géométries
   passent par le cache des requêtes : les redessiner après un ajout ne coûte rien. */
async function tracerChoix() {
  if (!carteLieu) return;
  if (coucheChoix) { carteLieu.removeLayer(coucheChoix); coucheChoix = null; }
  const formes = [];
  if (etat.zone) {
    const z = etat.zone;
    formes.push({ type:'Polygon', coordinates:[[[z.swlng, z.swlat], [z.nelng, z.swlat],
      [z.nelng, z.nelat], [z.swlng, z.nelat], [z.swlng, z.swlat]]] });
  }
  for (const l of etat.lieux) {
    try {
      const d = await appelDirect('/places/' + l.id, {});
      const p = d.results && d.results[0];
      if (p && p.geometry_geojson) formes.push(p.geometry_geojson);
      else if (l.bbox) formes.push(l.bbox);
    } catch (e) { if (l.bbox) formes.push(l.bbox); }
  }
  if (!formes.length || !carteLieu) return;
  coucheChoix = L.geoJSON({ type:'GeometryCollection', geometries:formes },
    { style:{ color:'#2F6B4F', weight:2, fillColor:'#2F6B4F', fillOpacity:0.12 },
      interactive:false }).addTo(carteLieu);
}

async function chercherLieux() {
  const cible = $('#lieux-trouves');
  if (!carteLieu || !cible) return;
  cible.innerHTML = `<span class="etat">${t('chercheLieux')}</span>`;
  const b = carteLieu.getBounds();
  try {
    const d = await appelDirect('/places/nearby', {
      nelat:b.getNorth().toFixed(4), nelng:b.getEast().toFixed(4),
      swlat:b.getSouth().toFixed(4), swlng:b.getWest().toFixed(4),
      per_page:30
    });
    const r = d.results || {};
    const vus = new Set();
    const lieux = [...(r.standard || []), ...(r.community || [])]
      .filter(p => !vus.has(p.id) && vus.add(p.id))
      .sort((a, b2) => (b2.bbox_area || 0) - (a.bbox_area || 0))
      .slice(0, 14);

    if (!lieux.length) { cible.innerHTML = `<span class="etat">${t('aucunLieuIci')}</span>`; return; }
    cible.innerHTML = lieux.map((p, i) =>
      `<span class="jeton" data-i="${i}">${echap(p.display_name || p.name)}<small>${
        echap(p.place_type_name || '')}</small></span>`).join('');
    cible.querySelectorAll('.jeton').forEach(el => el.addEventListener('click', () => {
      const p = lieux[+el.dataset.i];
      if (!etat.lieux.some(x => x.id === p.id)) {
        etat.lieux.push({ id:p.id, nom:p.display_name || p.name,
          bbox:p.bounding_box_geojson || null, loc:p.location || null, aire:p.bbox_area || null });
        dessinerJetons();
        tracerChoix();
      }
    }));
  } catch (e) {
    cible.innerHTML = `<span class="etat">${t('aucunLieuIci')}</span>`;
  }
}

/* ============================================================
   Découvertes : les espèces vues pour la première fois dans la zone
   ============================================================ */

/* L'API ne sait pas dire « quelles espèces sont nouvelles ». On procède par différence :
   les espèces vues pendant la fenêtre, moins celles déjà connues avant. Les deux comptages
   sont groupés, species_counts acceptant des listes de taxons. Pour les dater, une seule
   requête triée par date croissante et restreinte à ces espèces suffit : on retient la
   première venue de chacune. Six requêtes en tout. */
let decouvertes = null, decEnCours = false, decMois = 60;
let decMondiales = false;   // n'afficher que les premières mondiales
/* Les paliers sont pris en entier : couper au milieu d'une tranche reviendrait à écarter des
   espèces de même ancienneté que celles conservées, au hasard de l'ordre de la liste. On
   accumule donc jusqu'à dépasser un seuil, puis on s'arrête net. */
const DEC_SEUIL = 12;        // on cesse d'élargir la fenêtre dès que ce nombre est atteint
const DEC_PAR_PAGE = 12;     // fiches par page
const DEC_PLAFOND = 96;      // datation maximale : chaque espèce coûte une requête
let decPage = 0;
const DEC_FENETRES = [1, 3, 6, 12, 24, 60];   // mois, du plus court au plus long

function ilYa(mois) { const d = new Date(); d.setMonth(d.getMonth() - mois); return d; }
const jour = d => d.toISOString().slice(0, 10);

/* Une requête par espèce, triée par date croissante et limitée à un résultat : c'est la
   première observation, sans ambiguïté. J'avais tenté de grouper les quinze espèces en une
   seule requête, mais le tri par date les mélange — une espèce commune dans le monde remplit
   les premières pages à elle seule et les autres n'apparaissent jamais. */
async function premiereObs(params, sens = 'asc') {
  const base = { ...params, order_by:'observed_on', order:sens, per_page:1 };
  let d = null;
  if (await testerV2()) {
    try {
      d = await appel('/observations', { ...base, fields:'(id:!t,observed_on:!t)' }, true);
    } catch (e) { d = null; }
  }
  if (!d) d = await appel('/observations', base);
  const o = d.results && d.results[0];
  return o ? { obs:o.id, date:o.observed_on || '' } : null;
}

/* Espèces apparues dans la zone au cours des N derniers mois : celles vues pendant la
   fenêtre, moins celles déjà connues avant. */
async function nouveautes(mois, gen) {
  const f = filtres();
  const sansDates = !(await testerMoisV2(f));
  const debut = jour(ilYa(mois));
  const veille = jour(new Date(ilYa(mois).getTime() - 86400000));

  /* Une espèce de l'inventaire sans aucune observation avant cette date y est forcément
     apparue depuis. Une seule requête paginée suffit donc : celle des espèces déjà connues
     avant la fenêtre. Auparavant je demandais les espèces récentes, puis j'interrogeais leur
     passé par lots de deux cents — une vingtaine de requêtes pour le même résultat. */
  const avant = new Set();
  for (let page = 1; page <= 20; page++) {
    const d = await comptages({ ...f, d2:veille, per_page:500, page }, sansDates);
    verifier(gen);
    d.results.forEach(r => avant.add(r.taxon.id));
    if (d.results.length < 500) break;
  }
  /* Seules les espèces réellement présentes au niveau de validation courant : l'inventaire
     conserve les deux niveaux, et une espèce absente de celui-ci n'a évidemment aucune
     observation avant la fenêtre — elle passait pour une nouveauté avant d'échouer à la
     datation, gonflant le décompte de candidates et vidant la liste affichée. */
  return { ids: etat.especes.filter(e => e.nZone > 0 && !avant.has(e.id)).map(e => e.id), debut };
}

async function chargerDecouvertes() {
  if (decEnCours || !etat.especes.length) return;
  decEnCours = true;
  const gen = generation;
  const f = filtres();

  try {
    dessinerDecouvertes();

    /* Chaque palier apporte une tranche d'ancienneté : ce qui est nouveau depuis trois mois,
       puis ce qui l'est depuis six sans l'être depuis trois, et ainsi de suite. En empilant
       ces tranches dans l'ordre, on obtient un classement par récence sans avoir daté quoi que
       ce soit. On s'arrête dès qu'il y en a assez pour remplir l'écran. */
    let nouvelles = [], debut = null, fenetre = DEC_FENETRES[0];
    const vus = new Set();
    for (const mois of DEC_FENETRES) {
      progression(t('decCharge'), 10 + (DEC_FENETRES.indexOf(mois) / DEC_FENETRES.length) * 50);
      const r = await nouveautes(mois, gen);
      verifier(gen);
      const tranche = r.ids.filter(id => !vus.has(id));
      tranche.forEach(id => vus.add(id));
      nouvelles = nouvelles.concat(tranche);
      debut = r.debut; fenetre = mois;
      if (nouvelles.length >= DEC_SEUIL) break;
    }
    decMois = fenetre;

    if (!nouvelles.length) {
      decouvertes = [];
      progression(t('mComplet'), null);
      return;                       // le rendu final a lieu dans le bloc « finally »
    }
    nouvelles = nouvelles.slice(0, DEC_PLAFOND);
    // Veille du début de la fenêtre retenue : sert à écarter les espèces déjà connues ailleurs.
    const veille = jour(new Date(ilYa(fenetre).getTime() - 86400000));

    // Date de première observation dans la zone, espèce par espèce.
    const premieres = new Map();
    for (let i = 0; i < nouvelles.length; i++) {
      progression(t('decCharge'), 60 + (i / nouvelles.length) * 30);
      const o = await premiereObs({ ...f, taxon_id:nouvelles[i], d1:debut });
      verifier(gen);
      if (o) premieres.set(nouvelles[i], o);
    }

    /* Première mondiale, en deux temps pour ne pas gaspiller de requêtes. Un comptage groupé
       écarte d'abord toutes les espèces déjà signalées quelque part avant la fenêtre : leur
       première mondiale est forcément antérieure. Il ne reste qu'une poignée de candidates,
       qu'on confirme une par une en comparant la date de leur plus ancienne observation
       mondiale à la nôtre. */
    const parId = new Map(etat.especes.map(e => [e.id, e]));
    const monde = { captive:'false', locale:langue };
    if (etat.qualite === 'research') monde.quality_grade = 'research';

    const ailleursAvant = new Set();
    for (let i = 0; i < nouvelles.length; i += 300) {
      const d = await comptages({ ...monde, d2:veille, per_page:500,
        taxon_id: nouvelles.slice(i, i + 300).join(',') }, !(await testerMoisV2(f)));
      verifier(gen);
      d.results.forEach(r => ailleursAvant.add(r.taxon.id));
    }

    const mondiales = new Map();
    for (const id of nouvelles) {
      if (ailleursAvant.has(id) || !premieres.has(id)) continue;
      progression(t('decCharge'), 92);
      const g = await premiereObs({ ...monde, taxon_id:id });
      verifier(gen);
      if (g) mondiales.set(id, g);
    }

    const liste = [];
    for (const id of nouvelles) {
      const p = premieres.get(id);
      if (!p) continue;
      const g = mondiales.get(id);
      liste.push({
        e: parId.get(id) || { id, nom:'#' + id, nomFr:'' },
        obs:p.obs, date:p.date,
        mondiale: !!(g && g.date && p.date && g.date === p.date)
      });
    }
    liste.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    decouvertes = liste; decPage = 0;
    progression(t('mComplet'), null);
  } catch (e) {
    if (!(e instanceof Annule)) progression(t('mEchec', String(e.message || e)), null);
  } finally {
    decEnCours = false;
    dessinerDecouvertes();
  }
}

function dessinerDecouvertes() {
  const v = $('#v-decouverte');
  if (!etat.especes.length) return;
  const toutes = decouvertes || [];
  const liste = decMondiales ? toutes.filter(x => x.mondiale) : toutes;

  v.innerHTML = `
    <div class="outils">
      ${toutes.some(x => x.mondiale) ? `<select id="d-mondiale">
        <option value=""${decMondiales ? '' : ' selected'}>${t('decFiltreTout')}</option>
        <option value="1"${decMondiales ? ' selected' : ''}>${t('decFiltreMond')}</option>
      </select>` : ''}
      <span class="compte">${liste.length ? t('decNb', nb(liste.length))
        : (decEnCours ? t('decCharge') : '')}${liste.length
          ? ' · ' + t('decFenetre', dureeTexte(decMois)) : ''}</span>
    </div>
    ${liste.length ? `<div class="planche">${liste.slice(decPage * DEC_PAR_PAGE,
      (decPage + 1) * DEC_PAR_PAGE).map(x => `
      <div class="fiche${x.mondiale ? ' mondiale' : ''}">
        ${boutonPanier(x.e.id)}
        <a class="img" href="https://www.inaturalist.org/observations/${x.obs}"
           target="_blank" rel="noopener">${x.e.photo
          ? `<img src="${vignette(x.e)}" loading="lazy" decoding="async" alt="">`
          : ''}${x.mondiale ? `<span class="drapeau">${t('decMondiale')}</span>` : ''}</a>
        <div class="corps">${blocNoms(x.e.nom, x.e.nomFr)}
          <div class="date">${echap(x.date)}</div></div>
      </div>`).join('')}</div>`
      : `<div class="vide">${decEnCours ? t('decCharge') : t('decVide')}</div>`}
    ${liste.length > DEC_PAR_PAGE ? `<div class="outils" style="margin-top:16px">
      <button class="discret" id="dec-prec"${decPage === 0 ? ' disabled' : ''}>‹</button>
      <span class="compte" style="margin-left:0">${decPage + 1} / ${
        Math.ceil(liste.length / DEC_PAR_PAGE)}</span>
      <button class="discret" id="dec-suiv"${(decPage + 1) * DEC_PAR_PAGE >= liste.length
        ? ' disabled' : ''}>›</button>
    </div>` : ''}
    <p class="note">${t('decNote')}</p>`;

  brancherPanier(v, dessinerDecouvertes);
  const dm = $('#d-mondiale');
  if (dm) dm.addEventListener('change', e => {
    decMondiales = !!e.target.value; decPage = 0; dessinerDecouvertes();
  });
  const dp = $('#dec-prec'), ds = $('#dec-suiv');
  if (dp) dp.addEventListener('click', () => { decPage--; dessinerDecouvertes(); });
  if (ds) ds.addEventListener('click', () => { decPage++; dessinerDecouvertes(); });

}

/* 1. Ce qu'il faut chercher ce mois-ci : les espèces dont c'est le mois le plus fourni. */
/* Mois où chaque espèce culmine. Sert à la fois à remplir la liste et à savoir quels mois
   n'ont rien à proposer — ceux-là sont grisés dans le menu plutôt que de renvoyer une page
   vide après un clic inutile. */
function picsParMois() {
  const compte = new Array(12).fill(0);
  const pic = new Map();
  if (!etat.phenologie) return { compte, pic };
  etat.phenologie.forEach((mens, id) => {
    const total = mens.reduce((a, b) => a + b, 0);
    if (total < 5) return;                       // sous cinq observations, le pic est du hasard
    let m = 0;
    for (let i = 1; i < 12; i++) if (mens[i] > mens[m]) m = i;
    pic.set(id, m);
    compte[m]++;
  });
  return { compte, pic };
}

function panneauChercher() {
  const mois = vue.moisChercher || (new Date().getMonth() + 1);
  const tri = vue.triChercher || 'obs';
  const parId = new Map(etat.especes.map(e => [e.id, e]));
  const { compte, pic } = picsParMois();
  const liste = [];
  etat.phenologie.forEach((mens, id) => {
    if (pic.get(id) !== mois - 1) return;
    const total = mens.reduce((a, b) => a + b, 0);
    const e = parId.get(id);
    if (!e) return;
    const pique = mens[mois - 1];
    // La responsabilité est la part des observations de référence réalisées dans la zone.
    const resp = e.nMonde >= Math.max(seuilMin, 1) ? e.nZone / e.nMonde : null;
    if (tri === 'resp' && resp === null) return;
    liste.push({ e, n:pique, part:pique / total, resp });
  });
  liste.sort((a, b) => tri === 'resp' ? b.resp - a.resp : b.n - a.n);

  return `
    <div class="outils" style="margin-top:30px">
      <span class="tit" style="margin:0">${t('aChercher')}</span>
      <select id="s-mois">${MOIS.map((m, i) =>
        `<option value="${i+1}"${i + 1 === mois ? ' selected' : ''}${
          compte[i] ? '' : ' disabled'}>${m}${compte[i] ? '' : ' —'}</option>`).join('')}</select>
      <select id="s-tri">
        <option value="obs"${tri === 'obs' ? ' selected' : ''}>${t('triPic')}</option>
        <option value="resp"${tri === 'resp' ? ' selected' : ''}>${t('triResp')}</option>
      </select>
      <span class="compte">${nb(liste.length)} ${t('especes')} · ${t('aChercherD')}</span>
    </div>
    ${liste.length ? `<div class="planche">${liste.slice(0, 24).map(x => `
      <div class="fiche">
        ${boutonPanier(x.e.id)}
        <a class="img" href="${lienTaxon(x.e.id, true)}" target="_blank" rel="noopener">${x.e.photo
          ? `<img src="${vignette(x.e)}" loading="lazy" decoding="async" alt="">`
          : ''}<span class="num">${Math.round(x.part * 100)} %</span></a>
        <div class="corps">
          <a href="${lienTaxon(x.e.id, true)}" target="_blank" rel="noopener"
             style="text-decoration:none">${blocNoms(x.e.nom, x.e.nomFr)}</a>
          <div class="bas"><a class="n" href="${lienINat(x.e.id, mois, 'map')}"
            target="_blank" rel="noopener">${tri === 'resp' && x.resp !== null
            ? pourcent(x.resp * 100) : nb(x.n) + ' ' + t('obs')}</a></div>
        </div>
      </div>`).join('')}</div>`
      : `<div class="vide">${t('aucunPic')}</div>`}
    <p class="note">${t('noteChercher')}</p>`;
}

/* Complétude mois par mois. Chaque mois est un échantillon indépendant : on y applique les
   deux estimateurs et on affiche la fourchette qu'ils encadrent. Aucune requête, la
   phénologie par espèce et par mois étant déjà en mémoire. */
function completudeMois() {
  const sortie = new Array(12).fill(null);
  if (!etat.phenologie) return sortie;
  for (let m = 0; m < 12; m++) {
    const c = [];
    etat.phenologie.forEach(mens => { if (mens[m] > 0) c.push(mens[m]); });
    if (c.length < 5) continue;
    const c1 = chao1(c), a = ace(c);
    const est = [c1.fiable ? c1.est : null, a].filter(x => x && x >= c.length);
    if (!est.length) continue;
    sortie[m] = { bas: c.length / Math.max(...est), haut: c.length / Math.min(...est) };
  }
  return sortie;
}

const TEINTES_COMPLETUDE = [
  { min:0.85, couleur:'#2F6B4F' }, { min:0.70, couleur:'#6E9C57' },
  { min:0.55, couleur:'#C6A73C' }, { min:0.40, couleur:'#C97E2B' },
  { min:0,    couleur:'#B4553A' }
];

function graphiqueMensuel() {
  const d = etat.mensuel, L = 60, R = 30, H = 240, T = 18, B = 34, W = 900;
  const largeur = W - L - R, hauteur = H - T - B;
  const connus = d.filter(l => l.especes !== null && l.especes !== undefined);
  const maxObs = Math.max(...d.map(l => l.obs), 1);
  const maxSp = Math.max(...connus.map(l => l.especes), 1);
  const pas = largeur / 12;

  /* Chaque barre empile ce qui a été vu et ce qui manque probablement : la part pleine
     correspond aux espèces effectivement relevées, la part olive au complément qu'estiment
     Chao1 et ACE. La hauteur totale est donc la richesse présumée du mois. */
  const comp = completudeMois();
  const total = d.map((l, i) => {
    const c = comp[i];
    if (!c || !l.especes) return l.especes || 0;
    const moyenne = (c.bas + Math.min(c.haut, 1)) / 2;
    return moyenne > 0 ? (l.especes || 0) / moyenne : (l.especes || 0);
  });
  const maxTot = Math.max(...total, 1);

  const barres = d.map((l, i) => {
    const vues = l.especes || 0;
    const hTot = (total[i] / maxTot) * hauteur;
    const hVues = (vues / maxTot) * hauteur;
    const x = (L + i*pas + pas*0.16).toFixed(1);
    const w = (pas*0.68).toFixed(1);
    const manque = Math.max(0, Math.round(total[i] - vues));
    return `<rect x="${x}" y="${(T + hauteur - hTot).toFixed(1)}" width="${w}"
        height="${Math.max(hTot - hVues, 0).toFixed(1)}" fill="#7A8B3C" opacity="0.45" rx="1"
        ><title>${MOIS[i]} · +${nb(manque)}</title></rect>
      <rect x="${x}" y="${(T + hauteur - hVues).toFixed(1)}" width="${w}"
        height="${hVues.toFixed(1)}" fill="#6E8B63" rx="1"
        ><title>${MOIS[i]} · ${nb(vues)}</title></rect>`;
  }).join('');


  const etiquettes = d.map((l, i) =>
    `<text x="${(L + i*pas + pas/2).toFixed(1)}" y="${H-16}" text-anchor="middle" font-size="11"
      fill="#8B9990" font-family="IBM Plex Mono, monospace">${MOIS_C[i]}</text>`).join('');

  /* Seconde lecture du même mois : le nombre d'espèces divisé par la complétude estimée,
     c'est-à-dire la richesse que l'on aurait relevée avec une prospection parfaite. Les deux
     séries cohabitent dans le SVG et l'on bascule leur opacité, ce qui donne une transition
     douce sans reconstruire le graphique. */
  const corrige = d.map((l, i) => {
    const c = comp[i];
    if (!c || !l.especes) return null;
    const moyenne = (c.bas + Math.min(c.haut, 1)) / 2;
    return moyenne > 0 ? l.especes / moyenne : null;
  });
  const maxCorr = Math.max(...corrige.filter(Boolean), maxSp);
  const barresCorr = corrige.map((v, i) => {
    if (!v) return '';
    const h = (v / maxCorr) * hauteur;
    return `<rect x="${(L + i*pas + pas*0.14).toFixed(1)}" y="${(T + hauteur - h).toFixed(1)}"
      width="${(pas*0.72).toFixed(1)}" height="${h.toFixed(1)}" fill="#7A8B3C" rx="1"
      ><title>${MOIS[i]} · ${nb(Math.round(v))}</title></rect>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="Observations et nombre d'espèces mois par mois">
    <line x1="${L}" y1="${T+hauteur}" x2="${W-R}" y2="${T+hauteur}" stroke="#C6CEC1"/>
    ${barres}
    <text x="${L}" y="${T-4}" font-size="11" fill="#7A8B3C"
      font-family="IBM Plex Mono, monospace">${nb(Math.round(maxTot))} ${t('especes')}</text>
    ${etiquettes}
  </svg>`;
}

    });
    $('#loupe-prec').addEventListener('click', () => loupeDefiler(-1));
    $('#loupe-suiv').addEventListener('click', () => loupeDefiler(1));
    document.addEventListener('keydown', ev => {
      if (l.hidden) return;
      if (ev.key === 'Escape') l.hidden = true;
      if (ev.key === 'ArrowLeft') loupeDefiler(-1);
      if (ev.key === 'ArrowRight') loupeDefiler(1);
    });
  },
  () => dessinerJetons(),
  () => {
    $('#ouvrir-carte').addEventListener('click', ouvrirSelecteur);
    $('#fermer-carte').addEventListener('click', () => { $('#selecteur').hidden = true; });
    $('#zone-vue').addEventListener('click', () => {
      if (!carteLieu) return;
      const b = carteLieu.getBounds();
      /* Trois décimales, soit une centaine de mètres. Au-delà, deux cadrages presque
         identiques produiraient deux zones distinctes, donc deux inventaires en mémoire. */
      const r = n => +n.toFixed(3);
      etat.zone = { swlat:r(b.getSouth()), swlng:r(b.getWest()),
                    nelat:r(b.getNorth()), nelng:r(b.getEast()) };
      dessinerJetons();
      tracerChoix();
    });
    $('#ma-position').addEventListener('click', () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => carteLieu && carteLieu.setView([pos.coords.latitude, pos.coords.longitude], 10),
        () => {});
    });
  },
  () => {
    $('#vider').addEventListener('click', viderMemoire);
    $('#stop').addEventListener('click', arreterTout);
    $('#voir-memoire').addEventListener('click', listerMemoire);
  },
  () => lireURL()
]) {
  try { etape(); } catch (e) { console.error('Démarrage :', e); }
}
</script>
</body>
</html>
